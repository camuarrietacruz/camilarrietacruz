    const subMeta = [p.year, tr(p.type)].filter(Boolean).join(' / ');
    if (subMeta){ const sm = document.createElement('span'); sm.className = 'pv-sub-meta'; sm.textContent = subMeta; sub.appendChild(sm); }
    if (tr(p.kind)){ const sk = document.createElement('span'); sk.className = 'pv-sub-kind'; sk.textContent = tr(p.kind); sub.appendChild(sk); }
    $('pvDesc').textContent = publicText(tr(p.description));
    $('pvDesc').hidden = !$('pvDesc').textContent;
    const linksEl = $('pvLinks');
    linksEl.innerHTML = '';
    (p.links || []).forEach(l => {
      const a = document.createElement('a');
      a.textContent = '↗ ' + tr(l.label);
      if (l.url){ a.href = l.url; a.target = '_blank'; a.rel = 'noopener'; }
      linksEl.appendChild(a);
    });
    const hasFields = !!(tr(p.client) || tr(p.services) || (p.credits || []).length);
    projectViewEl.querySelector('.pv-rows').hidden = !hasFields;
    projectViewEl.querySelector('.pv-body').classList.toggle('is-desc-bottom', !hasFields);
    $('pvClient').textContent = tr(p.client);
    $('pvServices').textContent = tr(p.services);
    $('pvCredits').innerHTML = '';
    (p.credits || []).forEach(c => {
      const d = document.createElement('div');
      d.className = 'pv-credit';
      const b = document.createElement('b'); b.textContent = tr(c.name);
      d.appendChild(b); d.appendChild(document.createTextNode(tr(c.role)));
      $('pvCredits').appendChild(d);
    });
    const expanded = info.classList.contains('is-expanded');
    $('pvInfoToggleLabel').textContent = expanded ? copy.pvHideInfo : copy.pvSeeInfo;
  }

  // feed infinito: el contenido se repite en copias; el scroll se mantiene
  // siempre entre la copia 1 y la 2, y al pasarse salta una copia entera
  // (mismo contenido = el salto no se nota). Así después de la última
  // imagen vuelve la primera, en los dos sentidos.
  function renderFeed(p){
    items = projectMedia(p);
    total = items.length;
    feed.innerHTML = '';
    const feedW = feed.clientWidth || window.innerWidth;
    const estCopyH = items.reduce((h, m) => h + feedW * (m.h || 1) / (m.w || 1), 0);
    const copies = Math.max(3, Math.ceil((feed.clientHeight * 3) / Math.max(1, estCopyH)) + 1);
    for (let c = 0; c < copies; c++){
      items.forEach((m, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'pv-item';
        wrap.dataset.index = i;
        wrap.style.aspectRatio = (m.w || 1) + ' / ' + (m.h || 1);
        let el;
        if (m.type === 'video'){
          el = document.createElement('video');
          // como una imagen más que se mueve: sin sonido ni controles, en loop.
          // Safari de iPhone solo reproduce solo si muted/playsinline están como atributos
          el.muted = true; el.loop = true; el.playsInline = true; el.autoplay = true; el.preload = 'metadata';
          el.setAttribute('muted', ''); el.setAttribute('playsinline', ''); el.setAttribute('autoplay', '');
          el.setAttribute('aria-hidden', 'true');
          // autoplay arranca TODAS las copias del carrusel: la que no se ve se frena sola
          el.addEventListener('play', () => { if (el.dataset.vis !== '1') el.pause(); });
          wrap.classList.add('is-video');
          if (m.poster) el.poster = m.poster;
          el.src = m.src;
          videoObserver.observe(el);
        } else {
          el = document.createElement('img');
          el.decoding = 'async';
          el.alt = c === 0 ? (m.alt || '') : '';
          el.src = m.src;
        }
        wrap.appendChild(el);
        feed.appendChild(wrap);
      });
    }
    measure();
    setFeedTop(copyH);
    updateCounter();
  }

  function measure(){
    const first = feed.children;
    offsets = [];
    for (let i = 0; i < total; i++) offsets.push(first[i].offsetTop);
    copyH = first[total] ? first[total].offsetTop - first[0].offsetTop : feed.scrollHeight;
  }

  function updateCounter(){
    if (!total) return;
    const probe = ((feed.scrollTop + feed.clientHeight * 0.35) % copyH + copyH) % copyH;
    let idx = 0;
    for (let i = 0; i < total; i++) if (offsets[i] <= probe) idx = i;
    counterNum.textContent = idx + 1;
    counterTotal.textContent = '/' + total;
    counterBar.style.strokeDashoffset = RING * (1 - (idx + 1) / total);
    $('pvCounter').style.setProperty('--cnt-a', (360 * (idx + 1) / total) + 'deg'); // botones: el canto azul se llena
  }

  /* scroll automático lento (como la referencia): el feed baja solo a
     FEED_AUTO_PX px/s. Mientras el mouse o el dedo están apretados sobre
     el feed, manda la persona; al soltar, el automático retoma en el
     acto. La rueda y el teclado no tienen "soltar": retoma apenas dejan
     de moverse (FEED_RESUME_MS). Con "reducir movimiento" no corre. */
  const FEED_AUTO_PX = 30;
  const FEED_RESUME_MS = 150;
  let lastSetTop = 0, autoPauseUntil = 0, holding = false, autoAcc = 0, autoLast = performance.now();
  let prevTop = 0;
  function setFeedTop(v){ feed.scrollTop = v; lastSetTop = prevTop = feed.scrollTop; }
  function autoTick(now){
    const dt = Math.min(50, now - autoLast);
    autoLast = now;
    if (currentProject && copyH && !prefersReducedMotion){
      const paused = holding || now < autoPauseUntil || snapping || window.scrollY > 0.5; // con el footer a medio destapar el auto no corre
      autoAcc += paused ? 0 : FEED_AUTO_PX * (typeof pvFeedSpeed === 'number' ? pvFeedSpeed : 1) * dt / 1000; // pvFeedSpeed: barrita de velocidad
      if (autoAcc >= 1){
        const px = Math.floor(autoAcc);
        autoAcc -= px;
        setFeedTop(feed.scrollTop + px);
      }
    }
    requestAnimationFrame(autoTick);
  }
  requestAnimationFrame(autoTick);
  ['touchstart', 'pointerdown'].forEach(type => {
    feed.addEventListener(type, () => { holding = true; autoAcc = 0; }, { passive:true });
  });
  // el "soltar" se escucha en window: el dedo/mouse puede soltarse fuera del feed
  ['touchend', 'touchcancel', 'pointerup', 'pointercancel'].forEach(type => {
    window.addEventListener(type, () => { holding = false; autoPauseUntil = 0; }, { passive:true });
  });
  ['wheel', 'keydown'].forEach(type => {
    feed.addEventListener(type, () => { autoPauseUntil = performance.now() + FEED_RESUME_MS; autoAcc = 0; }, { passive:true });
  });

  feed.addEventListener('scroll', () => {
    if (!copyH) return;
    /* touch: el feed solo es infinito mientras corre solo. Si la persona lo
       mueve con el dedo (scroll nativo: scrollTop distinto del que puso el
       JS) y llega al final de la última imagen, se frena ahí y se dispara
       sola la animación hacia el footer (no sigue al dedo, así no queda a
       medio camino). Volver hacia arriba lo maneja el gesto global
       (ver "gesto touch ↔ footer"). */
    /* (en compu, con los botones, pasa lo mismo con la rueda / el trackpad: ya no hay
       panel al costado por donde bajar al footer) */
    if ((!canHover || document.documentElement.classList.contains('pv-pill')) && feed.scrollTop !== lastSetTop){
      const top = feed.scrollTop;
      const lim = copyH * 2 - feed.clientHeight;
      if (top > lim && prevTop <= lim){ setFeedTop(lim); if (!snapping) scrollToY(appH, SNAP_MS); }
      else if (top < lim && window.scrollY > 0) setFeedTop(lim);
    }
    if (feed.scrollTop < copyH) setFeedTop(feed.scrollTop + copyH);
    else if (feed.scrollTop >= copyH * 2) setFeedTop(feed.scrollTop - copyH);
    lastSetTop = prevTop = feed.scrollTop;
    if (!rafPending){
      rafPending = true;
      requestAnimationFrame(() => { rafPending = false; updateCounter(); });
    }
  }, { passive:true });

  const videoObserver = new IntersectionObserver(entries => {
    // solo se reproduce el video que está en pantalla; fuera de pantalla, en pausa (batería)
    entries.forEach(e => {
      e.target.dataset.vis = e.isIntersecting ? '1' : '0';
      if (e.isIntersecting) e.target.play().catch(() => {}); else e.target.pause();
    });
  }, { root: feed, threshold: 0.25 });

  // celular: alto de la barra colapsada (el feed arranca debajo)
  /* cortina de la info (celular): el panel es de pantalla completa y una
     máscara (ver CSS) deja ver hasta --sh-edge. p: 0 = solo la barra,
     1 = todo. En el medio el borde inferior se infla en panza y se
     difumina, igual que la cortina hero → footer. */
  const SHEET_MS = 1100, SHEET_FAST_MS = 280, SHEET_BLUR = 56, SHEET_CURVE_MAX = 0.18;
  let barH = 0, sheetP = 0, sheetFrame = 0;
  function applySheet(p){
    sheetP = p;
    const H = projectViewEl.clientHeight, W = projectViewEl.clientWidth;
    const edge = barH + p * Math.max(0, H - barH);
    const curve = Math.sin(p * Math.PI) * Math.min(H, W) * SHEET_CURVE_MAX;
    const arc = Math.max(curve, 0.5), halfW = W / 2;
    info.style.setProperty('--sh-edge', edge + 'px');
    info.style.setProperty('--sh-curve', curve + 'px');
    info.style.setProperty('--sh-r', ((halfW * halfW + arc * arc) / (2 * arc)) + 'px');
    info.style.setProperty('--sh-blur', (SHEET_BLUR * Math.min(1, p * 6)) + 'px');
  }
  let sheetDemoT = null;
  function animateSheet(open, fast){
    cancelAnimationFrame(sheetFrame);
    clearTimeout(sheetDemoT);
    // sin cortina: la máscara se abre de golpe y el fondo y los textos entran con fade (CSS .pv-sheet-fade);
    // al cerrar se espera a que se desvanezcan antes de recortar
    if (isNarrow){
      if (open) applySheet(1);
      else sheetDemoT = setTimeout(() => { applySheet(0); info.scrollTop = 0; }, 360);
      return;
    }
    const from = sheetP, to = open ? 1 : 0;
    if (prefersReducedMotion || from === to){
      applySheet(to);
      if (!open) info.scrollTop = 0;
      return;
    }
    // fast (cerrar deslizando el dedo): respuesta inmediata, ease-out y ~4× más corta
    const dur = (fast ? SHEET_FAST_MS : SHEET_MS) * Math.abs(to - from), t0 = performance.now();
    const ease = fast ? (t => 1 - Math.pow(1 - t, 3)) : (t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const step = now => {
      const t = Math.min(1, (now - t0) / dur);
      applySheet(from + (to - from) * ease(t));
      if (t < 1) sheetFrame = requestAnimationFrame(step);
      else if (!open) info.scrollTop = 0;
    };
    sheetFrame = requestAnimationFrame(step);
  }

  /* panel abierto: deslizar con el dedo hacia arriba CIERRA el panel (misma
     cortina que "- info"); no scrollea la página ni va al footer. Si el
     contenido no entra en pantalla (descripciones largas con créditos)
     scrollea por dentro y recién al llegar al final el deslizar cierra. */
  function updateScrollable(){
    info.classList.toggle('is-scrollable', info.scrollHeight > info.clientHeight + 1);
  }
  const CLOSE_SWIPE_PX = 6;
  let infoTouchY = null, infoSwipeDone = false;
  info.addEventListener('touchstart', e => { infoTouchY = e.touches[0].clientY; infoSwipeDone = false; }, { passive:true });
  info.addEventListener('touchmove', e => {
    if (infoTouchY === null || !info.classList.contains('is-expanded')) return;
    const atBottom = !info.classList.contains('is-scrollable') || info.scrollTop + info.clientHeight >= info.scrollHeight - 1;
    const up = infoTouchY - e.touches[0].clientY; // >0: dedo hacia arriba
    if (up > 0 && !atBottom) return; // todavía hay texto por scrollear dentro del panel
    if (e.cancelable) e.preventDefault(); // que el gesto no scrollee la página
    if (up > CLOSE_SWIPE_PX && !infoSwipeDone){
      infoSwipeDone = true;
      setInfoOpen(false, true);
    }
  }, { passive:false });
  info.addEventListener('touchend', () => { infoTouchY = null; }, { passive:true });
  info.addEventListener('touchcancel', () => { infoTouchY = null; }, { passive:true });

  // alto de la barra (padding + encabezado); el feed arranca debajo
  function measureBar(){
    if (!isNarrow) return;
    const cs = getComputedStyle(info);
    barH = info.querySelector('.pv-head').offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    if (info.classList.contains('is-expanded')) updateScrollable();
    projectViewEl.style.setProperty('--pv-bar-h', barH + 'px');
    applySheet(sheetP);
  }

  let cxTimer = 0;
  function setInfoOpen(open, fast){
    info.classList.toggle('is-expanded', open);
    $('pvInfoToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    $('pvInfoToggleLabel').textContent = open ? I18N[currentLang].pvHideInfo : I18N[currentLang].pvSeeInfo;
    if (open) updateScrollable();
    animateSheet(open, fast);
    const cx = $('pvContact');
    clearTimeout(cxTimer);
    if (open) cx.classList.add('is-under-panel');
    else cxTimer = setTimeout(() => cx.classList.remove('is-under-panel'), (fast ? SHEET_FAST_MS : SHEET_MS) * 0.9);
  }
  $('pvInfoToggle').addEventListener('click', () => setInfoOpen(!info.classList.contains('is-expanded')));

  $('pvBack').addEventListener('click', () => Router.home());
  $('pvContact').addEventListener('click', () => scrollToFooter());

  // re-medir cuando el feed cambia de tamaño de verdad (resize, rotación,
  // pasar a layout de celular): con el evento resize de window se medía
  // antes de que se aplicara el layout nuevo y el loop quedaba desfasado.
  // Se conserva en qué parte del contenido estaba (fracción de una copia).
  let lastFeedW = 0, lastFeedH = 0;
  new ResizeObserver(() => {
    if (!currentProject || !total) return;
    const w = feed.clientWidth, h = feed.clientHeight;
    if (w === lastFeedW && h === lastFeedH) return;
    lastFeedW = w; lastFeedH = h;
    const keep = copyH ? (((feed.scrollTop % copyH) + copyH) % copyH) / copyH : 0;
    measure();
    setFeedTop(copyH + keep * copyH);
    updateCounter();
  }).observe(feed);
  window.addEventListener('resize', () => { if (currentProject) measureBar(); });
  narrowMQ.addEventListener('change', () => { if (currentProject) measureBar(); });

  return {
    render(p){
      cancelAnimationFrame(sheetFrame);
      clearTimeout(cxTimer);
      $('pvContact').classList.remove('is-under-panel');
      sheetP = 0;
      info.classList.remove('is-expanded', 'is-scrollable');
      $('pvInfoToggle').setAttribute('aria-expanded', 'false');
      info.scrollTop = 0;
      renderText(p);
      measureBar();
      if (typeof pvMeasureDrops === 'function') pvMeasureDrops();
      renderFeed(p);
    },
    renderText,
    clear(){ feed.innerHTML = ''; items = []; total = 0; copyH = 0; },
    // el auto-scroll espera a que termine la entrada
    pauseAuto(ms){ autoPauseUntil = performance.now() + ms; autoAcc = 0; },
    // el item del feed que ocupa el borde de arriba (con la imagen que se ve)
    topItem(){
      const fr = feed.getBoundingClientRect();
      const probe = fr.top + 2;
      for (const el of feed.children){
        const r = el.getBoundingClientRect();
        if (r.top <= probe && r.bottom > probe) return el;
      }
      return feed.children[0] || null;
    },
    feedRect(){ return feed.getBoundingClientRect(); },
    feedEl(){ return feed; }
  };
})();

function refreshProjectLang(){
  if (aboutRefreshHook) aboutRefreshHook();
  updateCardAria();
  if (!currentProject) return;
  ProjectView.renderText(currentProject);
  applyProjectSeo(currentProject);
}

/* -------- mostrar / esconder un proyecto --------
   TRANSICIÓN: por ahora un fade simple (.is-open en el CSS). La animación
   final de entrada/salida se enchufa SOLO en enterProjectView() y
   leaveProjectView(), sin tocar el resto. */
/* -------- transición hero ↔ proyecto --------
   Abrir desde una card: la imagen de la card viaja y crece hasta el lugar de
   la primera foto del carrusel; mientras tanto el negro de la vista se funde
   por encima del hero (sin destello crema). Al llegar se funde con la foto
   real, y el panel de info entra (en celular la barra baja desde arriba).
   Volver: al revés — la foto que se ve se achica hacia su card (siguiéndola
   en vivo, porque el anillo sigue girando) mientras el hero reaparece.
   Entrando por link directo, sin hero, o con "reducir movimiento": fundido
   simple. Si llega otra navegación en medio (atrás del navegador, gesto de
   iPhone), la transición en curso se termina al instante antes de seguir. */
const PV_FLY_MS = 520;   // abrir: zoom in rápido desde la card
const PV_NAME_MS = 400;  // el nombre del hero sube a su botón (y vuelve): arranca y frena suave, con su propio tiempo
const PV_BACK_MS = 620;  // volver: un poco más calmo
function easeOutQuart(t){ return 1 - Math.pow(1 - t, 4); } // arranca de golpe, frena suave al llegar
let pvTransition = null;
function finishPvTransition(){
  if (!pvTransition) return;
  const t = pvTransition;
  pvTransition = null;
  t.finish();
}
function easeInOutCubic(t){ return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function plainRect(r){ return { left:r.left, top:r.top, width:r.width, height:r.height }; }
function lerpRect(a, b, e){
  return { left:lerp(a.left, b.left, e), top:lerp(a.top, b.top, e), width:lerp(a.width, b.width, e), height:lerp(a.height, b.height, e) };
}
function placeFlyer(el, r){
  el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
  el.style.width = r.width + 'px'; el.style.height = r.height + 'px';
}
/* qué parte de la primera foto del carrusel muestra la card del home (en
   fracciones de la foto). Por defecto: recorte cuadrado centrado; un proyecto
   puede definir cardCrop si su card está recortada en otro lugar. */
function cardCropFor(p, target){
  if (!p || !p.media || !p.media.length) return { x:0, y:0, w:1, h:1 }; // sin fotos: la card ES la imagen
  if (p.cardCrop) return p.cardCrop;
  const r = target.getBoundingClientRect(), a = r.width / r.height; // proporción de la foto
  return a >= 1 ? { x:(1 - 1 / a) / 2, y:0, w:1 / a, h:1 } : { x:0, y:(1 - a) / 2, w:1, h:a };
}
// a partir de la caja de la card, la caja que tendría la foto entera con ese recorte
function expandCrop(r, c){
  const w = r.width / c.w, h = r.height / c.h;
  return { left: r.left - c.x * w, top: r.top - c.y * h, width: w, height: h };
}
function cropOf(img, c){
  return { left: img.left + c.x * img.width, top: img.top + c.y * img.height, width: c.w * img.width, height: c.h * img.height };
}
/* una sola foto vuela (la grande), encuadrada siempre igual que la card: clip =
   la caja visible, img = la foto entera; la imagen chica de la card (over) va
   pegada a su recorte dentro de la foto, así si se funde no hay doble imagen */
function placeFlyerAligned(fly, clip, img, crop){
  placeFlyer(fly.el, clip);
  const set = (im, r) => {
    if (!im) return;
    im.style.inset = 'auto';
    im.style.left = (r.left - clip.left) + 'px'; im.style.top = (r.top - clip.top) + 'px';
    im.style.width = r.width + 'px'; im.style.height = r.height + 'px';
  };
  set(fly.under, img);
  set(fly.over, cropOf(img, crop));
}
// imagen voladora con dos capas: "under" de base y "over" encima (se funde)
function makeFlyer(underSrc, overSrc, rect){
  const el = document.createElement('div');
  el.className = 'pv-flyer';
  el.setAttribute('aria-hidden', 'true');
  const under = document.createElement('img'); under.alt = ''; under.src = underSrc; el.appendChild(under);
  let over = null;
  if (overSrc){ over = document.createElement('img'); over.alt = ''; over.src = overSrc; el.appendChild(over); }
  placeFlyer(el, rect);
  document.body.appendChild(el);
  return { el, under, over };
}
function itemImageSrc(item){
  const media = item && item.querySelector('img, video');
  if (!media) return null;
  return media.tagName === 'IMG' ? (media.currentSrc || media.src) : (media.poster || null);
}
// la parte visible de un item del feed (puede ser más alto que la pantalla)
function visibleItemRect(item){
  const r = item.getBoundingClientRect(), f = ProjectView.feedRect();
  const top = Math.max(r.top, f.top), bottom = Math.min(r.bottom, f.bottom);
  return { left:r.left, top, width:r.width, height:Math.max(1, bottom - top) };
}
function cardForProject(p){
  const i = p && p.cards && p.cards.length ? p.cards[0] : null;
  return i != null ? stackImgs[i] : null;
}
function canFlyWith(card){
  if (!card || prefersReducedMotion || !homeStarted || !document.body.classList.contains('stage-active')) return false;
  const r = card.getBoundingClientRect();
  return r.width > 2 && r.bottom > 0 && r.top < window.innerHeight;
}
function revealChrome(){
  // dos frames: el estado "afuera" se pinta antes de que arranque la transición
  requestAnimationFrame(() => requestAnimationFrame(() => projectViewEl.classList.remove('pv-chrome-out')));
}

function enterProjectView(opts){
  finishPvTransition();
  const card = opts && opts.cardIndex != null ? stackImgs[opts.cardIndex] : null;
  const target = ProjectView.topItem();

  if (!canFlyWith(card) || !target){
    // entrada simple (link directo, sin hero o con "reducir movimiento"): el
    // fondo negro aparece de una (si se fundiera, durante el fundido se vería
    // el footer que está detrás) y lo que entra con transición son las fotos
    // y el panel
    // estado inicial aplicado sin transiciones (panel afuera, fotos ocultas),
    // y recién después se sueltan para que entren
    const parts = [projectViewEl, ProjectView.feedEl(), projectViewEl.querySelector('.pv-info')];
    parts.forEach(el => { el.style.transition = 'none'; });
    projectViewEl.classList.add('is-open');
    if (!prefersReducedMotion) projectViewEl.classList.add('pv-chrome-out', 'pv-feed-hidden');
    void projectViewEl.offsetWidth;
    parts.forEach(el => { el.style.transition = ''; });
    loader.style.visibility = 'hidden';
    if (!prefersReducedMotion){
      ProjectView.pauseAuto(900);
      requestAnimationFrame(() => requestAnimationFrame(() => projectViewEl.classList.remove('pv-chrome-out', 'pv-feed-hidden')));
    }
    return;
  }

  const from = plainRect(card.getBoundingClientRect());
  // destino: lo que efectivamente se ve de la primera foto del carrusel
  // (puede ser más alta que la pantalla; así no hay re-encuadre al llegar)
  const to = visibleItemRect(target);
  const fullTo = plainRect(target.getBoundingClientRect()); // la foto entera (puede pasarse de la pantalla)
  if (typeof LiquidDistort !== 'undefined') LiquidDistort.leave();
  // la capa del efecto líquido (hover de desktop) se apaga en el acto: si no,
  // quedaba un instante la card "fantasma" en su lugar mientras la otra volaba
  const liquidCanvas = document.querySelector('#center-wrap > canvas');
  if (liquidCanvas){ liquidCanvas.style.transition = 'none'; liquidCanvas.style.opacity = '0'; requestAnimationFrame(() => { liquidCanvas.style.transition = ''; }); }
  card.style.visibility = 'hidden';
  const realSrc = itemImageSrc(target);
  const crop = cardCropFor(currentProject, target);
  const fromImg = expandCrop(from, crop); // la foto entera, encuadrada como la card
  // base: la foto real del proyecto; encima: la de la card (pegada a su recorte),
  // que se funde apenas la grande está cargada
  const fly = makeFlyer(realSrc || card.src, realSrc ? card.src : null, from);
  placeFlyerAligned(fly, from, fromImg, crop);
  // las fotos del carrusel se ocultan EN EL ACTO (sin su fade de 0.3s): si no, se
  // veían un instante en su lugar mientras la imagen todavía volaba (doble imagen
  // que "saltaba" al llegar)
  const feedEl = ProjectView.feedEl();
  feedEl.style.transition = 'none';
  projectViewEl.classList.add('pv-flying', 'pv-feed-hidden', 'pv-chrome-out', 'is-open');
  void feedEl.offsetWidth;
  feedEl.style.transition = '';

  /* barra de compu: el nombre que se leía en el centro del anillo (hover) viaja
     hasta su lugar en la barra mientras la card crece */
  const titleEl = document.getElementById('pvTitle');
  if (typeof pvMeasureDrops === 'function') pvMeasureDrops();
  titleEl.style.transition = ''; titleEl.style.opacity = ''; titleEl.style.color = ''; delete titleEl.dataset.noScramble;
  let nameFly = null, nameFrom = null, nameTo = null, nameScale = 1;
  projectViewEl.style.setProperty('--pv-name-w', (titleEl.getBoundingClientRect().width + (document.documentElement.classList.contains('pv-pill') ? 64 : 56)) + 'px');
  const rootCl = document.documentElement.classList;
  if (((rootCl.contains('pv-bar') && !isNarrow) || rootCl.contains('pv-pill')) && !landscapePhone && nameText.dataset.state === 'project'){
    // origen y destino: la caja del texto (centro y alto de línea), no la del elemento
    const fsA = parseFloat(getComputedStyle(nameText).fontSize), fsB = parseFloat(getComputedStyle(titleEl).fontSize);
    nameFrom = pvTextBox(nameText);
    nameTo = pvTextBox(titleEl);
    nameScale = fsB / fsA;
    nameFly = document.createElement('div');
    nameFly.className = 'pv-name-flyer';
    nameFly.setAttribute('aria-hidden', 'true');
    nameFly.textContent = titleEl.textContent;
    nameFly.style.fontSize = fsA + 'px';
    nameFly.style.letterSpacing = getComputedStyle(nameText).letterSpacing;
    nameFly.style.transformOrigin = '50% 0';
    document.body.appendChild(nameFly);
    nameFrom.w = nameFly.offsetWidth;
    nameFly.style.transform = 'translate(' + (nameFrom.cx - nameFrom.w / 2) + 'px,' + nameFrom.top + 'px)';
    nameText.classList.add('pv-name-away');
    titleEl.dataset.noScramble = '1';
    titleEl.style.color = 'transparent';
  }
  const landName = () => {
    if (!nameFly) return;
    nameFly.remove(); nameFly = null;
    titleEl.style.transition = 'none'; titleEl.style.opacity = '1'; titleEl.style.color = '';
    // el nombre del hero sigue oculto mientras el proyecto está abierto (si no, reaparece
    // un instante arriba, donde lo deja el scroll del footer); vuelve al cerrar o al bajar al footer
  };

  const t0 = performance.now();
  let raf = 0, chromeIn = false;
  // la foto grande del carrusel puede tardar en bajar: la imagen que vuela se
  // queda hasta que esté lista (como mucho 2.5s) y recién ahí se cambia
  const targetImg = target.querySelector('img');
  const targetReady = (!targetImg || (targetImg.complete && targetImg.naturalWidth)) ? Promise.resolve()
    : Promise.race([(targetImg.decode ? targetImg.decode() : Promise.resolve()).catch(() => {}), new Promise(r => setTimeout(r, 2500))]);
  ProjectView.pauseAuto(60000); // quieto hasta que la pantalla quede armada (ver abajo)
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    cancelAnimationFrame(raf);
    placeFlyerAligned(fly, to, fullTo, crop);
    if (!nameFly) projectViewEl.classList.remove('pv-chrome-out'); // (si el nombre sigue viajando, los botones esperan a que llegue)
    loader.style.visibility = 'hidden';
    card.style.visibility = '';
    targetReady.then(() => {
      // cambio en el acto (sin fundido): la foto del carrusel es la misma, en el
      // mismo lugar, así que no se nota; un fundido cruzado oscurecía a mitad de camino
      const fe = ProjectView.feedEl();
      fe.style.transition = 'none';
      if (currentProject) projectViewEl.classList.remove('pv-feed-hidden'); // (si ya volvió al home, no)
      void fe.offsetWidth;
      fe.style.transition = '';
      requestAnimationFrame(() => { fly.el.remove(); projectViewEl.classList.remove('pv-flying'); });
      // la pantalla ya está armada: el carrusel arranca solo, desde esa misma foto
      ProjectView.pauseAuto(700);
    });
  };
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / PV_FLY_MS);
    const e = easeOutQuart(t);
    placeFlyerAligned(fly, lerpRect(from, to, e), lerpRect(fromImg, fullTo, e), crop);
    // la imagen de la card se cambia por la foto grande solo si esa ya cargó
    if (fly.over && t > 0.45 && fly.under.complete && fly.under.naturalWidth) fly.over.style.opacity = '0';
    if (!chromeIn && !nameFly && t > 0.5){ chromeIn = true; projectViewEl.classList.remove('pv-chrome-out'); }
    if (t < 1) raf = requestAnimationFrame(tick);
    else { pvTransition = null; finish(); }
  };
  // el nombre: sube derecho a su botón; recién cuando llega se arman los botones
  if (nameFly){
    const nameTick = now => {
      if (!nameFly) return;
      const tn = Math.min(1, (now - t0) / PV_NAME_MS), en = easeInOutCubic(tn);
      const nx = lerp(nameFrom.cx, nameTo.cx, en) - nameFrom.w / 2, ny = lerp(nameFrom.top, nameTo.top, en);
      nameFly.style.transform = 'translate(' + nx + 'px,' + ny + 'px) scale(' + lerp(1, nameScale, en) + ')';
      if (tn < 1) requestAnimationFrame(nameTick);
      else { landName(); chromeIn = true; projectViewEl.classList.remove('pv-chrome-out'); }
    };
    requestAnimationFrame(nameTick);
  }
  pvTransition = { finish: () => { finish(); if (nameFly){ landName(); projectViewEl.classList.remove('pv-chrome-out'); } } };
  raf = requestAnimationFrame(tick);
}

function leaveProjectView(project){
  finishPvTransition();
  const card = cardForProject(project);
  const top = ProjectView.topItem();

  if (window.scrollY > 0.5 || !top || !canFlyWith(card)){
    projectViewEl.classList.remove('is-open');
    loader.style.visibility = '';
    return;
  }

  const from = visibleItemRect(top);
  const fullFrom = plainRect(top.getBoundingClientRect());
  const topSrc = itemImageSrc(top);
  // vuelve una sola foto (la del carrusel) y se va encuadrando como la card;
  // al aterrizar se cambia por la card en el acto (es la misma imagen)
  const isFirst = top.dataset.index === '0'; // la card corresponde a la primera foto
  const crop = isFirst ? cardCropFor(project, top) : { x:0, y:0, w:1, h:1 };
  const fly = makeFlyer(topSrc || card.src, null, from);
  placeFlyerAligned(fly, from, fullFrom, crop); // arranca con el mismo encuadre que el carrusel
  card.style.visibility = 'hidden';
  loader.style.visibility = '';
  loader.style.transition = 'opacity 0.5s ease';
  loader.style.opacity = '0';
  projectViewEl.classList.add('pv-flying', 'pv-feed-hidden', 'pv-chrome-out');
  projectViewEl.classList.remove('is-open');
  requestAnimationFrame(() => { loader.style.opacity = '1'; });

  // botones: el nombre vuelve al centro del hero (solo se desplaza)
  let backName = null, bnFrom = null, bnTo = null;
  const titleB = document.getElementById('pvTitle');
  if (document.documentElement.classList.contains('pv-pill') && !landscapePhone && cardLabel && cardLabel.setNow){
    const ci = stackImgs.indexOf(card);
    bnFrom = pvTextBox(titleB);
    cardLabel.setNow(ci);
    // destino: donde queda el nombre en el home (sin el corrimiento que le pone el scroll del footer)
    const keepT = nameText.style.transform;
    nameText.style.transform = 'translateY(-50%)';
    bnTo = pvTextBox(nameText);
    nameText.style.transform = keepT;
    backName = document.createElement('div');
    backName.className = 'pv-name-flyer';
    backName.setAttribute('aria-hidden', 'true');
    backName.textContent = nameText.textContent;
    backName.style.fontSize = bnTo.fs + 'px';
    backName.style.letterSpacing = getComputedStyle(nameText).letterSpacing;
    document.body.appendChild(backName);
    bnFrom.w = backName.offsetWidth;
    backName.style.transform = 'translate(' + (bnFrom.cx - bnFrom.w / 2) + 'px,' + bnFrom.top + 'px)';
    nameText.classList.add('pv-name-away');
    titleB.style.color = 'transparent';
  }
  const landBackName = () => {
    if (!backName) return;
    backName.remove(); backName = null;
    nameText.classList.remove('pv-name-away');
    titleB.style.color = '';
    // si el mouse ya no está sobre la card, el nombre vuelve a lo de siempre
    setTimeout(() => { if (!card.matches(':hover') && cardLabel) cardLabel.hide(); }, 600);
  };

  const t0 = performance.now();
  let raf = 0;
  const finish = () => {
    cancelAnimationFrame(raf);
    fly.el.remove();
    card.style.visibility = '';
    loader.style.transition = '';
    loader.style.opacity = '';
    projectViewEl.classList.remove('pv-flying', 'pv-feed-hidden', 'pv-chrome-out');
  };
  const tick = (now) => {
    const t = Math.min(1, (now - t0) / PV_BACK_MS);
    const e = easeInOutCubic(t);
    // la card sigue moviéndose con el anillo: el destino se mide en cada frame
    const cardR = plainRect(card.getBoundingClientRect());
    placeFlyerAligned(fly, lerpRect(from, cardR, e), lerpRect(fullFrom, expandCrop(cardR, crop), e), crop);
    if (t < 1) raf = requestAnimationFrame(tick);
    else { pvTransition = null; finish(); }
  };
  if (backName){
    const nameTick = now => {
      if (!backName) return;
      const tn = Math.min(1, (now - t0) / PV_NAME_MS), en = easeInOutCubic(tn);
      backName.style.transform = 'translate(' + (lerp(bnFrom.cx, bnTo.cx, en) - bnFrom.w / 2) + 'px,' + lerp(bnFrom.top, bnTo.top, en) + 'px)';
      if (tn < 1) requestAnimationFrame(nameTick); else landBackName();
    };
    requestAnimationFrame(nameTick);
  }
  pvTransition = { finish: () => { finish(); landBackName(); } };
  raf = requestAnimationFrame(tick);
}

// teclado: al abrir un proyecto el foco pasa a la flecha de volver; al cerrar,
// vuelve a la card desde la que se entró (si se entró con teclado)
let focusBeforeProject = null;
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !currentProject) return;
  const inf = document.getElementById('pvInfo');
  if (inf && inf.classList.contains('is-expanded')) document.getElementById('pvInfoToggle').click(); // primero se cierra la info
  else Router.home();
});
function showProject(slug, opts){
  const p = projectBySlug(slug);
  if (!p) return false;
  const wasOpen = !!currentProject;
  if (!wasOpen){
    focusBeforeProject = document.activeElement;
    requestAnimationFrame(() => { const b = document.getElementById('pvBack'); if (b) b.focus({ preventScroll: true }); });
  }
  currentProject = p;
  window.scrollTo(0, 0);
  projectViewEl.style.transform = '';
  document.documentElement.classList.add('project-open');
  document.body.classList.add('project-open');
  projectViewEl.setAttribute('aria-hidden', 'false');
  enableCursorTracking();
  // se renderiza primero (oculta, pero con medidas reales) para saber a
  // dónde tiene que viajar la imagen de la card
  ProjectView.render(p);
  if (!wasOpen) enterProjectView(opts);
  applyProjectSeo(p);
  updateFooterScroll();
  return true;
}

function hideProject(){
  if (!currentProject) return;
  setTimeout(() => { if (!document.querySelector('.pv-name-flyer')) nameText.classList.remove('pv-name-away'); }, 0); // (si vuelve volando, lo saca el aterrizaje)
  if (focusBeforeProject && focusBeforeProject !== document.body && document.contains(focusBeforeProject)){
    const el = focusBeforeProject;
    // la card está oculta mientras vuelve volando (PV_BACK_MS): se enfoca al aterrizar
    setTimeout(() => el.focus({ preventScroll: true }), PV_BACK_MS + 60);
  }
  focusBeforeProject = null;
  const leaving = currentProject;
  currentProject = null;
  leaveProjectView(leaving);
  projectViewEl.setAttribute('aria-hidden', 'true');
  projectViewEl.style.transform = '';
  document.documentElement.classList.remove('project-open');
  document.body.classList.remove('project-open');
  window.scrollTo(0, 0);
  restoreHomeSeo();
  setTimeout(() => { if (!currentProject) ProjectView.clear(); }, 400);
  updateFooterScroll();
}

/* -------- routing: /slug abre el proyecto, / es el home --------
   pushState al abrir desde una card, popstate para el botón "atrás".
   Entrando directo por link a /slug no corre el loader: el home recién
   arranca (loader incluido) la primera vez que se vuelve a "/". */
let homeStarted = false;
function slugFromPath(){
  return decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, '')) || null;
}
/* el loader está sincronizado con los frames del ojito y hace caer las 15
   cards: antes de arrancar espera a que estén cargados (como mucho 4s; si la
   red es muy lenta arranca igual). Mientras tanto se ve el nombre y el 0%. */
function heroAssetsReady(){
  const imgs = [ojito].concat(stackImgs);
  const ready = imgs.map(img => (img.decode ? img.decode() : Promise.resolve()).catch(() => {}));
  if (document.fonts && document.fonts.ready) ready.push(document.fonts.ready);
  return Promise.race([Promise.all(ready), new Promise(r => setTimeout(r, 4000))]);
}
function startHome(){
  if (homeStarted) return;
  homeStarted = true;
  heroAssetsReady().then(() => {
    // el gif vuelve a su primer frame justo cuando arranca el loader
    const src = ojito.getAttribute('src');
    ojito.src = ''; ojito.src = src;
    runLoader();
  });
}
const Router = {
  open(slug, opts){
    if (currentProject && currentProject.slug === slug) return;
    if (!projectBySlug(slug)) return;
    history.pushState({ project: slug, fromHome: true }, '', '/' + slug);
    showProject(slug, opts);
  },
  home(){
    // si se llegó desde el home, "volver" es el atrás del navegador (no
    // deja una entrada de más en el historial); si se entró por link, va a /
    if (history.state && history.state.fromHome) history.back();
    else {
      history.pushState({}, '', '/');
      hideProject();
      startHome();
    }
  }
};
window.addEventListener('popstate', () => {
  const slug = slugFromPath();
  if (slug && projectBySlug(slug)) showProject(slug);
  else { hideProject(); startHome(); }
});
function openProjectForCard(i){
  // la card con tu foto no abre un proyecto: abre "tu cielo" (ver About)
  if (i === ABOUT_CARD){ About.openRoute({ cardIndex: i }); return; }

var pvFeedSpeed = 1;
(function(){
  const input = document.getElementById('pvSpeedInput'), box = document.getElementById('pvSpeed'), play = document.getElementById('pvPlay');
  const track = box.querySelector('.pv-speed-track');
  let lastMoving = 50;
  function apply(v){
    v = Math.max(0, Math.min(100, Math.round(v)));
    pvFeedSpeed = v <= 2 ? 0 : (v <= 50 ? v / 50 : 1 + (v - 50) / 25);
    input.value = v; track.style.setProperty('--v', v / 100);
    box.classList.toggle('is-stopped', pvFeedSpeed === 0);
    box.classList.toggle('is-fast', v >= 90);
    play.classList.toggle('is-stopped', pvFeedSpeed === 0);
    const en = typeof currentLang !== 'undefined' && currentLang === 'en';
    input.setAttribute('aria-label', en ? 'Carousel speed' : 'Velocidad del carrusel');
    input.setAttribute('aria-valuetext', pvFeedSpeed === 0 ? (en ? 'Stopped' : 'Quieto') : (Math.round(pvFeedSpeed * 10) / 10 + '×'));
    play.setAttribute('aria-label', pvFeedSpeed === 0 ? (en ? 'Play the carousel' : 'Reanudar el carrusel') : (en ? 'Pause the carousel' : 'Pausar el carrusel'));
    if (pvFeedSpeed > 0) lastMoving = v;
    try { localStorage.setItem('pvSpeed', String(v)); } catch(e){}
  }
  let saved = 50; try { const x = parseFloat(localStorage.getItem('pvSpeed')); if (!isNaN(x)) saved = x; } catch(e){}
  apply(saved);
  input.addEventListener('input', () => apply(+input.value));
  play.addEventListener('click', () => apply(pvFeedSpeed === 0 ? (lastMoving > 2 ? lastMoving : 50) : 0));
  // que tocar los controles no cuente como "agarrar" el carrusel ni cierre la info
  [box, play].forEach(el => ['pointerdown', 'touchstart', 'click'].forEach(t => el.addEventListener(t, e => e.stopPropagation(), { passive: true })));
})();

let pvLiquidRun = null;
function pvLiquidStop(){
  if (!pvLiquidRun) return;
  cancelAnimationFrame(pvLiquidRun.raf);
  pvLiquidRun.layer.remove();
  document.getElementById('projectView').classList.remove('pv-liquid');
  pvLiquidRun = null;
}
function pvLiquidBuild(){
  const root = document.documentElement, pv = document.getElementById('projectView');
  pvLiquidStop();
  if (!root.classList.contains('pv-split') || !root.classList.contains('pv-in-ac')) return;
  if (root.classList.contains('is-landscape-phone') || prefersReducedMotion) return;
  const title = document.getElementById('pvTitle'), back = document.getElementById('pvBack'), cnt = document.getElementById('pvCounter');
  const pr = pv.getBoundingClientRect(), tb = title.getBoundingClientRect();
  if (!tb.width || !back.offsetWidth || !cnt.offsetWidth) return;
  const T = { l: tb.left - pr.left, r: tb.right - pr.left }, R = tb.height / 2, cy = tb.top - pr.top + R;
  const B = { cx: back.offsetLeft + back.offsetWidth / 2 };
  const C = { cx: cnt.offsetLeft + cnt.offsetWidth / 2, w: cnt.offsetWidth };
  const layer = document.createElement('div');
  layer.className = 'pv-liquid-layer';
  const condense = true; // el vidrio se condensa alrededor del nombre antes de estirarse
  if (condense) layer.classList.add('is-condensing');
  pv.appendChild(layer);
  pv.classList.add('pv-liquid');
  const f = n => Math.round(n * 10) / 10;
  // contorno de varias "cápsulas" en fila, unidas por cuellos de grosor t
  const neckTop = (a, b, t) => {
    const x1 = a.r - a.R, y1 = cy - a.R, x2 = b.l + b.R, y2 = cy - b.R, xm = (x1 + x2) / 2, ym = cy - t / 2, h = (x2 - x1) * 0.3;
    return ' C' + f(x1 + h) + ',' + f(y1) + ' ' + f(xm - h) + ',' + f(ym) + ' ' + f(xm) + ',' + f(ym) + ' C' + f(xm + h) + ',' + f(ym) + ' ' + f(x2 - h) + ',' + f(y2) + ' ' + f(x2) + ',' + f(y2);
  };
  const neckBottom = (a, b, t) => {
    const x1 = b.l + b.R, y1 = cy + b.R, x2 = a.r - a.R, y2 = cy + a.R, xm = (x1 + x2) / 2, ym = cy + t / 2, h = (x1 - x2) * 0.3;
    return ' C' + f(x1 - h) + ',' + f(y1) + ' ' + f(xm + h) + ',' + f(ym) + ' ' + f(xm) + ',' + f(ym) + ' C' + f(xm - h) + ',' + f(ym) + ' ' + f(x2 + h) + ',' + f(y2) + ' ' + f(x2) + ',' + f(y2);
  };
  const component = (S, N) => {
    const a = S[0], z = S[S.length - 1];
    let d = 'M' + f(a.l) + ',' + f(cy) + ' A' + f(a.R) + ',' + f(a.R) + ' 0 0 1 ' + f(a.l + a.R) + ',' + f(cy - a.R);
    S.forEach((s, i) => { d += ' L' + f(s.r - s.R) + ',' + f(cy - s.R); if (i < S.length - 1) d += neckTop(s, S[i + 1], N[i]); });
    d += ' A' + f(z.R) + ',' + f(z.R) + ' 0 0 1 ' + f(z.r) + ',' + f(cy) + ' A' + f(z.R) + ',' + f(z.R) + ' 0 0 1 ' + f(z.r - z.R) + ',' + f(cy + z.R);
    for (let i = S.length - 1; i >= 0; i--){ d += ' L' + f(S[i].l + S[i].R) + ',' + f(cy + S[i].R); if (i > 0) d += neckBottom(S[i - 1], S[i], N[i - 1]); }
    return d + ' A' + f(a.R) + ',' + f(a.R) + ' 0 0 1 ' + f(a.l) + ',' + f(cy) + ' Z';
  };
  const neckT = (dist, dMax, rMin) => dist >= dMax ? 0 : 2 * rMin * Math.pow(1 - dist / dMax, 0.55); // gruesa un rato y se corta rápido
  const dMaxL = Math.min(((T.l + R) - B.cx) * 0.6, 5 * R), dMaxR = Math.min((C.cx - (T.r - R)) * 0.6, 5 * R);
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const delay = condense ? 344 : 61, dur = 765, t0 = performance.now();
  const draw = e => {
    const thin = 1 - 0.14 * Math.sin(Math.PI * e); // en el aire la gota se afina apenas
    const xl = lerp(T.l + R, B.cx, e), rl = R * thin;
    const xr = lerp(T.r - R, C.cx, e), rr = R * thin, hw = Math.max(rr, lerp(R, C.w / 2, e));
    const L = { l: xl - rl, r: xl + rl, R: rl }, P = { l: T.l, r: T.r, R: R }, Q = { l: xr - hw, r: xr + hw, R: rr };
    const tL = neckT((T.l + R) - xl, dMaxL, rl), tR = neckT(xr - (T.r - R), dMaxR, rr);
    const parts = [];
    if (tL > 1.5 && tR > 1.5) parts.push(component([L, P, Q], [tL, tR]));
    else if (tL > 1.5){ parts.push(component([L, P], [tL])); parts.push(component([Q], [])); }
    else if (tR > 1.5){ parts.push(component([L], [])); parts.push(component([P, Q], [tR])); }
    else { parts.push(component([L], [])); parts.push(component([P], [])); parts.push(component([Q], [])); }
    layer.style.clipPath = "path('" + parts.join(' ') + "')";
  };
  draw(0);
  const run = pvLiquidRun = { layer, raf: 0 };
  const tick = now => {
    if (pvLiquidRun !== run) return;
    const p = Math.max(0, Math.min(1, (now - t0 - delay) / dur));
    draw(ease(p));
    if (p < 1){ run.raf = requestAnimationFrame(tick); return; }
    // listo: los botones de verdad toman su lugar (en el mismo cuadro, sin parpadeo) y el canto se dibuja
    pv.classList.add('pv-rims-draw');
    pvLiquidStop();
    setTimeout(() => pv.classList.remove('pv-rims-draw'), 850);
  };
  run.raf = requestAnimationFrame(tick);
}

    if (prefersReducedMotion) return;
    const items = [];
    projectViewEl.querySelectorAll('.pv-title, .pv-index, .pv-meta, .pv-coords').forEach((el, i) => {
      if (el.dataset.noScramble) return; // el nombre llega volando desde el home
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = w.nextNode())) if (n.data.trim()) items.push({ n, orig: n.data, last: null, start: 90 + i * 60 });
    });
    const t0 = performance.now(), DUR = 380;
    function frame(now){
      let done = true;
      items.forEach(it => {
        if (it.dead) return;
        if (it.last !== null && it.n.data !== it.last){ it.dead = true; return; } // cambió el idioma: se deja
        const k = (now - t0 - it.start) / DUR;
        if (k >= 1){ it.n.data = it.orig; it.dead = true; return; }
        done = false;
        const fixed = Math.max(0, Math.floor(k * it.orig.length));
        let s = it.orig.slice(0, fixed);
        for (let j = fixed; j < it.orig.length; j++){
          const c = it.orig[j];
          s += /[\s\/·.,°]/.test(c) ? c : CH[Math.random() * CH.length | 0];
        }
        it.n.data = s; it.last = s;
      });
      if (!done) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  let wasOut = projectViewEl.classList.contains('pv-chrome-out');
  new MutationObserver(() => {
    const out = projectViewEl.classList.contains('pv-chrome-out');
    if (wasOut && !out) scramble();
    wasOut = out;
  }).observe(projectViewEl, { attributes: true, attributeFilter: ['class'] });
})();

// se resuelve cuando terminó de cargar todo el script: showProject usa
// cosas del footer que se definen más abajo
queueMicrotask(function initRoute(){
  cardAriaReady = true;
  updateCardAria();
  const slug = slugFromPath();
  if (slug && projectBySlug(slug)){
    history.replaceState({ project: slug }, '', '/' + slug);
    showProject(slug);
  } else if (slug === ABOUT_SLUG){
    // la card personal se abre sobre el home, que arranca detrás
    history.replaceState({ about: true }, '', '/' + ABOUT_SLUG);
    startHome();
    About.show();
  } else {
    if (slug) history.replaceState({}, '', '/'); // ruta desconocida → home
    startHome();
  }
});

/* -------- footer: el hero se traslada hacia arriba con el scroll
   (solo una vez activo el stage) destapando el footer fijo detrás,
   con la misma sombra-que-se-levanta calcada del video de referencia
   nuageboi.fr. -------- */
const footerShadowEl = document.getElementById('footerShadow');
const pvContactEl = document.getElementById('pvContact');
const FOOTER_START_OPACITY = 0.55;
const FOOTER_FADE_END = 0.65;
const CURTAIN_CURVE_MAX = 0.18; // profundidad máxima de la panza, en fracción del lado más corto de la pantalla
const SUBTITLE_FADE_END = 0.18; // se apaga rápido, bien al principio del scroll

// Reveal en cascada de las palabras del footer (copyright + firma
// CAMUXI): cada .rv-word entra con blur + stretch horizontal que se
// resuelve en foco nítido, tipo "motion blur" (ref. Cappen), apenas
// arranca el scroll — no espera a que el footer termine de destaparse.
// Orden explícito de abajo hacia arriba: primero la firma CAMUXI y el
// renglón más bajo del copyright, y va subiendo hasta el renglón de
// arriba (© AÑO NOMBRE) — así nunca queda flotando solo el de arriba
// con un hueco vacío debajo mientras el resto todavía no apareció.
const copyLines = Array.from(document.querySelectorAll('.footer-copyright .rv-word'));
const markWord = document.querySelector('.footer-signature-mark .rv-word');
// orden pedido: 1) © año nombre, 2) ALL RIGHTS RESERVED, 3) Work shown...,
// 4) firma CAMUXI — de arriba hacia abajo, terminando en la firma.
const revealWords = [copyLines[0], copyLines[1], copyLines[2], markWord].filter(Boolean);
const REVEAL_STAGGER_MS = 260; // delay entre cada elemento de la secuencia

let footerWordsRevealed = false;
function triggerFooterWordsReveal(){
  if (footerWordsRevealed) return;
  footerWordsRevealed = true;
  revealWords.forEach((el, i) => {
    setTimeout(() => { el.classList.add('is-visible'); }, i * REVEAL_STAGGER_MS);
  });
}

/* la firma CAMUXI del footer lleva al hero: desde un proyecto vuelve al home;
   desde el home sube con la misma animación del scroll. */
(function(){
  const mark = document.querySelector('.footer-signature-mark');
  if (!mark) return;
  const goHero = () => {
    if (currentProject) Router.home();
    else scrollToY(0, NAME_SCROLL_MS);
  };
  mark.addEventListener('click', goHero);
  mark.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goHero(); }
  });
})();

/* proyecto → footer, en dos tiempos y rápido (nunca se mezclan):
   1) fotos, panel, flecha y contador se apagan a negro (0 → 15% del recorrido)
   2) recién ahí el negro de la vista se funde y aparece el footer (15% → 35%) */
function smoothstep01(x){ x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
function pvChromeEls(){ return projectViewEl.querySelectorAll('.pv-info, .pv-back, .pv-counter, .pv-feed'); }
function pvFooterFade(p){
  pvFooterDirty = true;
  const cf = 1 - smoothstep01(p / 0.15);
  pvChromeEls().forEach(c => { c.style.transition = 'none'; c.style.opacity = String(cf); });
  projectViewEl.style.transition = 'none';
  projectViewEl.style.opacity = String(1 - smoothstep01((p - 0.15) / 0.2));
  projectViewEl.style.pointerEvents = p > 0.3 ? 'none' : '';
}
function pvFooterReset(){
  pvFooterDirty = false;
  ['transition', 'opacity', 'pointerEvents'].forEach(k => { projectViewEl.style[k] = ''; });
  pvChromeEls().forEach(c => { c.style.transition = ''; c.style.opacity = ''; });
}

function updateFooterScroll(){
  if (!document.body.classList.contains('stage-active') && !currentProject) return;
  const vh = appH;
  const p = Math.max(0, Math.min(1, window.scrollY / vh));
  scrollP = p; // lo lee startOrbit() para blendear la implosión de las cards
  loader.style.transform = 'translateY(' + (-p * 100) + '%)';
  // panza del borde inferior: 0 al inicio y al final, máxima a mitad
  // el radio sale de la flecha del arco: R = (ancho²/4 + alto²) / (2·alto)
  // (sobre el lado más corto de la pantalla, así en celular vertical no se pasa de profunda)
  const halfW = window.innerWidth / 2;
  const curve = Math.sin(p * Math.PI) * Math.min(vh, halfW * 2) * CURTAIN_CURVE_MAX;
  // (con curva ~0 el radio queda enorme: arco casi recto, pero igual difuminado)
  const arc = Math.max(curve, 0.5);
  loader.style.setProperty('--curve', curve + 'px');
  loader.style.setProperty('--curve-r', ((halfW * halfW + arc * arc) / (2 * arc)) + 'px');
  // un proyecto abierto se funde (no sube como cortina)
  if (currentProject && p >= 0.002) pvFooterFade(p);
  else if (pvFooterDirty) pvFooterReset();
  updateThemeColor();
  if (p > 0.01) triggerFooterWordsReveal();
  // CX de contacto de la vista de proyecto: fijo en pantalla, se desvanece apenas arranca el scroll
  // (apagado del todo al 3% del recorrido: antes de que asome el footer, así nunca se pisa con CAMUXI)
  if (pvContactEl){
    const f = 1 - Math.min(1, p / 0.03);
    pvContactEl.firstElementChild.style.opacity = String(f);
    pvContactEl.style.pointerEvents = f < 0.05 ? 'none' : '';
  }

  const t = Math.min(1, p / FOOTER_FADE_END);
  const eased = 1 - Math.pow(1 - t, 2);
  if (footerShadowEl) footerShadowEl.style.opacity = FOOTER_START_OPACITY * (1 - eased);

  // "Buenos Aires — Argentina": arranca a desvanecerse en el mismo
  // momento que las cards empiezan a implosionar, pero termina rápido
  // (bien al principio del scroll) para que ya esté invisible antes
  // de que las imágenes lleguen a superponerse con el texto
  const subT = Math.min(1, p / SUBTITLE_FADE_END);
  const subEase = 1 - Math.pow(1 - subT, 2);
  if (subLocationEl) subLocationEl.style.opacity = String(0.5 * (1 - subEase));

  // el nombre viaja pegado al resto del bloque hasta tocar la altura
  // de la fila SAY HELLO / FOLLOW / LET'S TALK del footer — ahí se
  // frena (aunque el bloque siga subiendo detrás) sin perder su
  // centrado horizontal, que sigue viniendo del "left" propio
  if (footerLinksTop !== null){
    const rawTop = nameStartTop - p * vh;
    // en celular el nombre ya está arriba: se queda ahí todo el scroll
    const stopTop = (isNarrow || nameText.classList.contains('ls-top')) ? nameStartTop : footerLinksTop;
    // desde un proyecto el nombre ya está quieto en su lugar final (no sube con el scroll)
    const clampedTop = currentProject ? stopTop : Math.max(stopTop, rawTop);
    const compensation = clampedTop - rawTop;
    nameText.style.transform = 'translateY(calc(-50% + ' + compensation + 'px))';
  }

  // desde un proyecto el hero está oculto (y con él tu nombre), pero en el
  // footer el nombre tiene que estar igual que desde el home: se muestra
  // solo él (visibility:visible le gana al hero oculto) y aparece a medida
  // que el footer se destapa; arriba de todo, sobre el proyecto, no se ve
  if (currentProject){
    const k = Math.min(1, Math.max(0, (p - 0.2) / 0.25));
    if (k > 0) nameText.classList.remove('pv-name-away');
    if (k > 0 && nameText.style.visibility !== 'visible') centerNameText();
    nameText.style.visibility = k > 0 ? 'visible' : '';
    nameText.style.opacity = k > 0 ? String(k) : '';
  } else if (nameText.style.visibility){
    nameText.style.visibility = '';
    nameText.style.opacity = '';
  }
}
document.addEventListener('scroll', () => requestAnimationFrame(updateFooterScroll), { passive:true });

// re-centrar el nombre y recalcular las referencias de layout cuando
// cambia el tamaño del viewport (responsive resize, no solo el resize
// real de la ventana) — si no, el nombre queda con el "left" fijo que
// calculó la última vez y se desalinea del centro
window.addEventListener('resize', () => {
  refreshAppH();
  rebuildRingGeometry();
  if (!document.body.classList.contains('stage-active')){
    if (isNarrow) centerNameText();
    refreshScrollLayoutRefs();
    return;
  }
  centerNameText();
  refreshScrollLayoutRefs();
  updateFooterScroll();
});
</script>
