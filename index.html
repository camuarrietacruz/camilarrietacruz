  <style>
  @font-face {
    font-family: 'Helvetica Now Display';
    src: url(/assets/fonts/helvetica-now-display-400.ttf) format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Helvetica Now Display';
    src: url(/assets/fonts/helvetica-now-display-300.ttf) format('truetype');
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Helvetica Now Display';
    src: url(/assets/fonts/helvetica-now-display-700.ttf) format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --blue: #0012FF;
    --cream: #F8F7EF;
    --black: #111111;
    --font: 'Helvetica Now Display', 'Helvetica Neue', Arial, sans-serif;
    /* margen único de compu: todo lo que toca un borde queda a 32px de ese
       borde, medido a lo que se ve (tinta del texto / borde de la forma).
       En celular cada regla html.is-narrow usa su propio sistema (24/32). */
    --m: 32px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  /* accesibilidad: indicador de foco SOLO al navegar con teclado (Tab), sutil,
     en crema; con mouse o dedo no aparece nunca */
  :focus{ outline:none; }
  :focus-visible{ outline:1px solid rgba(248,247,239,0.75); outline-offset:4px; border-radius:2px; }
  .stack-img:focus-visible{ outline-offset:6px; border-radius:0; }
  /* texto solo para lectores de pantalla (no se ve) */
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  html,body{ width:100%; height:100%; background:var(--cream); font-family:var(--font); overflow:hidden; }

  #loader{
    /* alto = --app-h (alto estable medido en JS, ver "base responsive"),
       no inset:0 — en mobile el alto real cambia con la barra del navegador */
    position:fixed; top:0; left:0; right:0; height:var(--app-h, 100vh); z-index:100;
    background: var(--blue);
  }
  #loader.inverted{
    background-color: var(--black);
    /* grano azul MUY sutil, chico y disperso (tipo puntitos, no degrade),
       tileable, con zonas donde se nota mas que otras */
    background-image: url(/assets/home/grain.png);
    background-repeat: repeat;
    background-size: 640px 640px;
  }

  .side-text{
    position:absolute; top:50%; transform:translateY(-50%);
    font-family: var(--font);
    font-weight:400;
    font-size: clamp(12px, 1.05vw, 17px);
    letter-spacing: normal;
    color: var(--cream);
    white-space: nowrap;
    text-transform: uppercase;
  }
  #name-text{ left:var(--m); z-index:9999; }
  #percent-text{ right:var(--m); }

  /* -------- celular (html.is-narrow, ancho < 600px): loader apilado --------
     nombre arriba (fijo, centrado desde el principio, no viaja), pila de
     cards/gif en el centro (explota igual que en desktop), tagline abajo.
     El % va centrado debajo de la pila. El "left" del nombre lo sigue
     poniendo el JS (centerNameText) para que se recentre mientras el
     scramble cambia el ancho del texto. */
  /* sistema de márgenes del celular (igual en loader, hero, proyecto y footer):
       · lateral 24px · superior e inferior 32px
       · fila de arriba (ES/EN y flecha de volver): arriba a 32px, centro a 41px
       · fila del nombre (hero) / título (proyecto): centro a 76px, 17.24px regular
     El nombre sigue centrado en horizontal (lo centra centerNameText). */
  html.is-narrow #name-text{
    top: calc(env(safe-area-inset-top, 0px) + 76px);
    font-size:17.24px; font-weight:400; letter-spacing:0.01em;
  }
  html.is-narrow #sub-location{ top: calc(env(safe-area-inset-top, 0px) + 93px); }
  html.is-narrow #percent-text{ left:0; right:0; text-align:center; top: calc(50% + 70px + 32px); }
  /* touch: el arrastre horizontal sobre el hero mueve el cover-flow; el
     vertical sigue siendo el scroll de la página (pan-y) */
  html.is-touch #loader{ touch-action: pan-y; }
  /* la frase apoya su borde de abajo a 32px (el margen inferior del sitio) */
  html.is-narrow #tagline{ bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }


  /* subtítulo de ubicación, debajo del nombre — el nombre viaja y
     termina centrado horizontalmente (startNameTravel), así que esto
     simplemente se centra en todo el ancho y queda alineado debajo.
     Aparece con fade-in junto con el resto del stage (mismo momento
     que dispara la explosión de las cards) via la clase stage-active
     que ya se agrega al body en onNameHitsPile(). */
  /* ---- celular girado (html.is-landscape-phone, lo pone el JS) ---- */
  /* hero: nombre / rol y ciudad centrados en el margen de arriba (el nombre sube
     ahí al explotar), con el mismo tamaño que en el celular vertical y bien juntos */
  html.is-landscape-phone #name-text.ls-top{
    top:29px; /* margen de arriba de 24px hasta la tinta de las mayúsculas */
    font-size:15.24px; letter-spacing:0.01em;
    transition: top 0.65s cubic-bezier(.2,.7,.2,1);
  }
  html.is-landscape-phone #sub-location{ top:40px; font-size:10px; }
  /* el carrusel queda centrado en el lugar libre entre los textos de arriba
     (nombre, ciudad) y los de abajo (proyecto): 1.5px más abajo del medio */
  html.is-landscape-phone body.stage-active #center-wrap{ top:calc(50% + 1.5px); transition: top 0.65s cubic-bezier(.2,.7,.2,1); }
  html.is-landscape-phone #center-wrap{ perspective:700px; }
  /* celular girado: Safari NO deja que la página use las franjas de los costados
     (la zona de la cámara; la página recibe 734 de 852px aunque pida
     viewport-fit=cover) y las pinta con el fondo del body. El fondo va oscuro
     como el hero desde el primer instante (media query, sin esperar al JS:
     Safari toma el color apenas carga). */
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 499.98px){
    html, body{ background:#111111 !important; }
  }
  .edge-probe{ display:none; }
  @media (pointer: coarse) and (orientation: landscape) and (max-height: 499.98px){
    .edge-probe{ display:block; position:fixed; left:env(safe-area-inset-left); right:env(safe-area-inset-right); top:0; height:1px; }
  }
  /* la página ocupa también las franjas de los costados del iPhone (viewport-fit=cover):
     el fondo llega a los bordes y lo que toca un borde se corre la zona de la cámara */
  html.is-landscape-phone{ --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  html.is-landscape-phone #name-text:not(.ls-top){ left:calc(var(--m) + var(--sl)); }
  html.is-landscape-phone #percent-text{ right:calc(var(--m) + var(--sr)); }
  html.is-landscape-phone .lang-switch{ right:calc(32px + var(--sr)); }
  html.is-landscape-phone .footer-content{ padding-left:calc(var(--m) + var(--sl)); padding-right:calc(var(--m) + var(--sr)); }
  html.is-landscape-phone .pv-info{ padding-left:calc(var(--pv-pad) + var(--sl)); }
  html.is-landscape-phone .pv-back{ left:calc(var(--m) - 2.3px + var(--sl)); }
  html.is-landscape-phone .pv-counter{ right:calc(var(--pv-pad) + var(--sr)); }
  html.is-landscape-phone .pv-contact{ right:calc(var(--m) + 4px + var(--sr)); }
  html.is-landscape-phone .about-close{ left:calc(var(--m) - 2.3px + var(--sl)); }
  /* sin sello CX-XX en esta vista (no hay lugar) */
  html.is-landscape-phone .cf-label-pill{ display:none; }
  /* proyecto del carrusel: nombre y qué es pegados, a 24px del borde de abajo
     (sin sumar la zona de la barra del iPhone). */
  /* solo en esta vista arriba y abajo no coinciden (por óptica): 24px arriba, 20px abajo.
     Abajo, el qué es del proyecto, el ES/EN y la fila del footer apoyan su línea de base a 20px */
  html.is-landscape-phone .cf-label{ bottom:15.5px; gap:2px; }
  html.is-landscape-phone .cf-label-name{ font-size:12px; opacity:0.9; } /* que no compita con tu nombre */
  /* la frase del loader también apoya su última línea a 20px */
  html.is-landscape-phone #tagline{ bottom:16.5px; }
  html.is-landscape-phone .lang-switch{ bottom:20px; }
  html.is-landscape-phone .footer-content{ padding-bottom:20px; }
  /* proyecto: título / qué es / año más juntos, y la descripción 20% más chica */
  html.is-landscape-phone .pv-title{ margin-bottom:4px; }
  html.is-landscape-phone .pv-kind{ margin:0 0 8px; }
  html.is-landscape-phone .pv-desc{ font-size:17.25px; }
  /* el panel es más alto que la pantalla: título / qué es / año quedan fijos
     arriba (con fondo) y la descripción scrollea por debajo, así nunca pasa
     por debajo de la flecha de volver */
  html.is-landscape-phone .pv-head{ position:sticky; top:0; z-index:1; } /* top:0 = el borde del padding del panel (Chrome/Safari descuentan el padding) */
  html.is-landscape-phone .pv-head::before{
    content:''; position:absolute; z-index:-1; pointer-events:none;
    left:calc(-1 * (var(--pv-pad) + var(--sl, 0px))); right:calc(-1 * var(--pv-pad));
    top:calc(-1 * (var(--m) + 64px)); bottom:-18px;
    background:linear-gradient(#07070a calc(100% - 18px), rgba(7,7,10,0));
  }
  /* el sello se ubica contra la cabecera (ahora posicionada): misma altura que la flecha */
  html.is-landscape-phone .pv-index{ top:-64px; right:0; }

  /* celular: proyecto de la card del frente del carrusel (Coverflow), apoyado
     abajo a 32px (el margen inferior del celular). Para que no se lea como un
     segundo "nombre + ciudad", el qué es va en la letra de telemetría (la de
     las coordenadas) y el sello CX-XX del panel va aparte, debajo de la card. */
  .cf-label{
    position:fixed; left:24px; right:24px; bottom:calc(env(safe-area-inset-bottom, 0px) + 32px); z-index:9999;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center; color:var(--cream); font-family:var(--font);
    pointer-events:none; opacity:0; transition:opacity 0.25s ease;
  }
  .cf-label-pill{
    position:fixed; left:50%; transform:translateX(-50%); z-index:9999;
    font-family:var(--font); color:var(--cream); white-space:nowrap;
    font-size:10px; letter-spacing:0.12em; line-height:12px;
    border:1px solid rgba(248,247,239,0.4); border-radius:999px; padding:5px 11px;
    pointer-events:none; opacity:0; transition:opacity 0.25s ease;
  }
  .cf-label-pill[hidden]{ display:none; }
  .cf-label-name{ font-size:14px; letter-spacing:0.01em; line-height:1.3; text-transform:uppercase; }
  .cf-label-sub{
    font-family:'Courier New', monospace; font-size:10px; letter-spacing:0.1em; line-height:1.4;
    text-transform:uppercase; opacity:0.55;
  }
  #sub-location{
    position:absolute; left:0; right:0;
    top: calc(50% + 14px);
    text-align:center;
    font-family: var(--font);
    font-weight:400;
    font-size: clamp(10px, 0.85vw, 13px);
    letter-spacing: 0.02em;
    color: var(--cream);
    opacity:0;
    z-index:9999;
    transition: opacity 1s ease;
  }
  body.stage-active #sub-location{ opacity:0.5; }
  /* al invertir a fondo oscuro: nombre y % se mantienen en light */

  /* legal footer — copyright + disclaimer de propiedad de los trabajos,
     esquina inferior izquierda, 32px de margen por lado. Aparece con el
     mismo fade que el resto del stage (stage-active). */
  #legal-text{
    position:absolute; left:32px; bottom:32px;
    font-family: var(--font);
    font-weight:400;
    font-size: clamp(9px, 0.7vw, 11px);
    line-height: 1.5;
    letter-spacing: 0.02em;
    color: var(--blue);
    opacity:0;
    z-index:9999;
    transition: opacity 1s ease;
  }
  body.stage-active #legal-text{ opacity:1; }

  /* mismo cuadro 127x127 para el ojo y para cada foto, perfectamente
     centrado en el viewport (independiente del ancho de los textos) */
  #center-wrap{
    position:absolute; left:50%; top:50%;
    transform: translate(-50%, -50%);
    width:140px; height:140px;
  }
  #center-wrap > *{
    position:absolute; inset:0;
    width:140px; height:140px;
    object-fit:cover;
    border-radius:0;
  }
  #ojito{ z-index:1; }

  .stack-img{
    opacity:0;
    z-index:0;
    transform: translateY(-46px) rotate(0deg);
  }
  .stack-img.fall{
    transition: transform 0.32s cubic-bezier(.22,1.12,.4,1), opacity 0.14s linear;
  }

  /* hover "masa": la card se levanta con sombra al pasar el cursor,
     vendiendo el tilt 3D como si tuviera peso propio (aprobado) */
  .stack-img{ transition: box-shadow 0.25s ease; }
  .stack-img.hover-mass{
    box-shadow: 0 22px 40px -8px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,18,255,0.25);
  }

  #tagline{
    position:absolute; bottom: 32px; left:0; right:0;
    text-align:center;
    font-family: var(--font);
    font-weight:400;
    font-size: clamp(12px, 1.05vw, 17px);
    letter-spacing: normal;
    line-height: 1.3;
    color: var(--cream);
    opacity:0;
    transition: opacity 0.7s ease, transform 0.5s ease;
  }
  /* al invertir a fondo oscuro: frase de abajo en light al 60% de opacidad */
  #loader.inverted #tagline{ color: var(--cream); opacity:0.6; }
  /* al llegar a 100%: se va hacia abajo con fade */
  #tagline.fade-down{ opacity:0 !important; transform: translateY(24px); }

  #percent-text{ transition: opacity 0.4s ease; }
  #percent-text.fade-out{ opacity:0; }

  /* cursor custom: circulito azul con glow sutil + una estela que es
     más glow difuminado que puntos planos (da sensación de profundidad),
     lightweight: unos pocos divs y un solo rAF, sin canvas ni libs */
  .cursor-dot{
    position:fixed; top:0; left:0;
    width:14px; height:14px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(0,18,255,0.95) 0%, rgba(0,18,255,0.55) 35%, rgba(0,18,255,0.18) 65%, rgba(0,18,255,0) 100%);
    box-shadow: 0 0 6px 0px rgba(0,18,255,0.35);
    mix-blend-mode: screen;
    pointer-events:none;
    z-index:999;
    opacity:0;
    transition: opacity 0.2s ease;
  }
  .cursor-dot.visible{ opacity:1; }
  /* variante footer: se activa cuando el cursor está sobre el footer
     (fondo azul) — ahí el glow azul con "screen" se pierde. Antes era
     un punto negro con blend "multiply", pero el negro no contrasta
     contra el azul (y con multiply se perdía casi del todo). Ahora usa
     el complementario del azul (#F5CD0A) sin blend mode, para que se
     lea como un punto amarillo real sobre el footer. */
  .cursor-dot.dark{
    background: radial-gradient(circle, rgba(245,205,10,0.95) 0%, rgba(245,205,10,0.6) 35%, rgba(245,205,10,0.2) 65%, rgba(245,205,10,0) 100%);
    box-shadow: 0 0 6px 0px rgba(245,205,10,0.4);
    mix-blend-mode: normal;
  }
  /* cursor nativo oculto SIEMPRE (loader incluido) — el custom (glow +
     estela) recién empieza a seguir el mouse cuando termina el loader,
     así que durante el loader no se ve ningún cursor, y después solo
     se ve el nuestro */
  body, body *{ cursor:none !important; }


  /* ===== FOOTER — reveal tipo nuageboi.fr =====
     El hero (#loader) es fixed y permanece igual en su lógica interna;
     lo único nuevo es que, una vez el stage está activo, el scroll
     queda habilitado y controla un translateY sobre #loader que lo
     "saca" de pantalla hacia arriba. Detrás, a menor z-index, vive el
     footer fixed con la foto de fondo — al irse el hero se destapa
     de abajo hacia arriba, sin mover el footer un solo píxel.
     Además arranca con una sombra que se levanta a medida que se
     revela (curva calcada del video de referencia), simulando que la
     sección de arriba todavía le pesa encima. */
  html.stage-active{ overflow-y:auto; }
  body.stage-active{ overflow-y:visible; height:auto; min-height:100%; }
  #loader{ will-change: transform; }
  /* borde inferior en "panza": una extensión del hero colgada justo
     debajo de su borde recto, recortada con un arco de círculo (centro
     más bajo que los costados, curvatura pareja de punta a punta, más
     "esférica" que una media elipse). El JS calcula el radio del
     círculo (--curve-r) para que el arco toque las dos esquinas y
     baje --curve en el centro. La altura (--curve)
     arranca en 0, se infla a mitad del scroll y vuelve a 0 al final,
     así la cortina se siente elástica. Es una extensión y no un
     recorte del hero para no cortar el nombre, que se queda frenado
     sobre el footer. background:inherit copia el negro + el grano, y
     el -alto del hero alinea el tile del grano con el del hero.
     El arco no es un corte nítido: una máscara radial lo deja sólido
     hasta el arco y lo desvanece hacia afuera a lo largo de
     --curve-blur, así el negro se funde con el azul. El desvanecido
     va solo hacia afuera (la caja es --curve-blur más alta) para que
     en las esquinas no asome el borde recto del hero. */
  #loader{ --curve-blur: 56px; }
  #loader::after{
    content:''; position:absolute; left:0; right:0; top:100%;
    height:calc(var(--curve, 0px) + var(--curve-blur));
    background:inherit;
    background-position:0 calc(var(--app-h, 100vh) * -1);
    -webkit-mask-image:radial-gradient(circle var(--curve-r, 0px) at 50% calc(var(--curve, 0px) - var(--curve-r, 0px)), #000 calc(var(--curve-r, 0px) - 1px), transparent calc(var(--curve-r, 0px) + var(--curve-blur)));
            mask-image:radial-gradient(circle var(--curve-r, 0px) at 50% calc(var(--curve, 0px) - var(--curve-r, 0px)), #000 calc(var(--curve-r, 0px) - 1px), transparent calc(var(--curve-r, 0px) + var(--curve-blur)));
    z-index:-1; pointer-events:none;
  }

  .footer-scroll-track{ height:calc(var(--app-h, 100vh) * 2); }

  .footer-fixed{
    position:fixed; inset:0; z-index:50;
    overflow:hidden;
  }
  .footer-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 30%;
  }
  /* celular: la foto es horizontal y los ojos están al 25% y al 73% del
     ancho — en pantalla vertical el recorte central los dejaba afuera a
     los dos. Se encuadra sobre el ojo derecho, grande y centrado. */
  html.is-narrow .footer-bg{ object-position: 88% center; }
  .footer-shadow{
    position:absolute; inset:0;
    background:#000;
    opacity:0.55;
    pointer-events:none;
    z-index:2;
  }
  .footer-content{
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:var(--m) var(--m) var(--m) var(--m);
    font-family:var(--font);
    color:var(--cream);
  }
  .footer-links{
    display:flex; gap:40px;
    font-size:clamp(11px, 0.9vw, 13px);
    letter-spacing:0.08em; text-transform:uppercase;
  }
  .footer-links a{ color:inherit; text-decoration:none; opacity:0.85; transition:opacity .2s ease; }
  .footer-links a:hover{ opacity:1; }
  .footer-bottom{
    position:relative;
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:24px; flex-wrap:wrap;
  }
  .footer-signature-mark{
    position:absolute; left:50%; bottom:0;
    transform:translateX(-50%);
    color:var(--cream); opacity:0.7;
    line-height:0;
    cursor:pointer; transition:opacity 0.25s ease;
  }
  html.can-hover .footer-signature-mark:hover{ opacity:1; }
  .footer-signature-mark svg{
    display:block; height:18.15px; width:auto;
  }
  /* celular: el texto legal (alineado a la izquierda) llega hasta el
     centro y se pisaba con la firma centrada — la firma pasa a la
     derecha, con su base alineada a la última línea del legal, y el
     legal deja libre ese lugar (si no entra, corta en una línea más) */
  html.is-narrow .footer-signature-mark{ left:auto; right:0; transform:none; }
  /* márgenes del celular: 24px a los lados, 32px arriba y abajo */
  html.is-narrow .footer-content{ padding:32px 24px 32px 24px; }
  html.is-narrow .footer-contact{ padding:0 24px; }
  html.is-narrow .footer-copyright{ max-width: calc(100% - 80px); }
  /* todas las últimas líneas del footer se apoyan en la misma línea de
     base: la de la firma CAMUXI (el borde de abajo de su svg). El último
     renglón legal quedaba 0.4em más arriba (el aire que deja su
     line-height 1.5) y el ES/EN 0.35em — se bajan en em para que la
     corrección acompañe el tamaño de letra en cualquier pantalla. En
     celular el ES/EN está arriba, así que ahí no se toca. */
  .footer-copyright{ position:relative; top:0.4em; }
  html:not(.is-narrow) .lang-btn{ transform:translateY(0.35em); }
  /* Bloque de contacto (SAY HELLO :) + email + teléfono), centrado en
     los dos ejes de la pantalla — position:absolute contra
     .footer-content (que ya es inset:0 del viewport fijo), así queda
     centrado real de pantalla sin importar el resto del layout. */
  .footer-contact{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%);
    display:flex; flex-direction:column; align-items:center;
    text-align:center; color:var(--cream);
    width:100%; padding:0 32px;
  }
  .footer-contact-label{
    font-size: clamp(8px, 1.02vw, 18px);
    letter-spacing:0.1em; text-transform:uppercase;
    color:#F8F7EF; opacity:0.6;
    margin-bottom: clamp(14px, 2.2vw, 34px);
    animation: footer-label-float 14s ease-in-out infinite;
  }
  /* desktop: 2px más chico que el nombre del hero (.side-text usa
     clamp(12px, 1.05vw, 17px)), así acompaña su escala sin competirle */
  html:not(.is-narrow) .footer-contact-label{ font-size: calc(clamp(12px, 1.05vw, 17px) - 2px); }
  /* "levita" alrededor de los datos de contacto — deriva orgánica y
     lenta, no una órbita cerrada, para que se sienta viva sin marear */
  @keyframes footer-label-float{
    0%   { transform: translate(0px, 0px); }
    22%  { transform: translate(10px, -8px); }
    46%  { transform: translate(-7px, 5px); }
    71%  { transform: translate(-11px, -6px); }
    100% { transform: translate(0px, 0px); }
  }
  .footer-contact-email,
  .footer-contact-phone{
    display:block;
    font-size: clamp(24px, 4.32vw, 82px);
    font-weight:300;
    line-height:1.2;
    white-space:nowrap;
    transition: opacity 0.35s ease;
    cursor:pointer;
    color:inherit; text-decoration:none;
  }
  /* al hover pasa a la variable Bold — al ser dos archivos de fuente
     estáticos distintos (no un variable font real) el cambio de peso
     no se puede animar/interpolar, salta directo de Light a Bold */
  /* touch: no hay hover (y en iOS el :hover queda "pegado" después de
     tocar), así que ahí el bold lo da .is-tapped un instante al tocar */
  html.can-hover .footer-contact-email:hover,
  html.can-hover .footer-contact-phone:hover,
  .footer-contact-email.is-tapped,
  .footer-contact-phone.is-tapped{
    font-weight:700;
  }
  /* Reveal de las palabras del footer (copyright + firma CAMUXI):
     simple fade in (igual mecanismo que "Buenos Aires — Argentina"),
     en secuencia, UNA sola vez la primera vez que se scrollea — no
     se repite ni se revierte al volver a scrollear hacia arriba. */
  .rv-word{
    display:inline-block;
    opacity:0;
    transition:opacity 0.8s ease;
    will-change:opacity;
  }
  .rv-word.is-visible{
    opacity:1;
  }
  .footer-copyright{
    font-size:clamp(9px, 0.7vw, 11px);
    line-height:1.5; letter-spacing:0.02em; opacity:0.7;
  }
  /* Say Hello / Follow / Let's Talk y CAMUXI (label viejo): pausados
     por pedido (van a volver en el rediseño) — visibility:hidden en
     vez de display:none/borrar para no romper el layout del footer
     ni la referencia de JS que usa la posición de .footer-links para
     "congelar" el nombre a esa altura durante el scroll. */
  .footer-paused{ visibility:hidden; pointer-events:none; }

  /* Selector de idioma ES/EN — siempre fijo en pantalla (hero y
     footer por igual), en el mismo margen 32px que usa la fila de
     legales/firma de abajo, pero por fuera de esa fila: necesita
     z-index por encima de #loader (100) para no quedar tapado
     mientras el hero todavía cubre el footer. */
  /* ════════ VISTA DE PROYECTO (/slug) ════════
     Capa fija a pantalla completa, sin scroll de página propio:
     · desktop/tablet: 3 zonas — izquierda vacía (volver + contador),
       columna de info en el color del proyecto, feed a la derecha
       (~65%) con scroll propio e infinito.
     · celular: barra arriba con la info colapsada ("Ver información"
       la despliega a pantalla completa) y el feed ocupa el resto.
     El scroll fuera del feed es el scroll real de la página: sube la
     vista como cortina y destapa el footer de siempre (el mismo que
     el home, no se duplica). */
  .project-view{
    --pv-panel: 35vw;              /* panel de info, desde el borde izquierdo */
    --pv-pad: var(--m); /* textos del panel, sello CX, contador y contacto */
    --pv-accent: var(--blue);
    position:fixed; top:0; left:0; right:0; height:var(--app-h, 100vh);
    z-index:200;
    background:var(--black); color:var(--cream);
    font-family:var(--font);
    opacity:0; visibility:hidden;
    transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    will-change: transform;
  }
  .project-view.is-open{
    opacity:1; visibility:visible;
    transition: opacity 0.35s ease, visibility 0s;
  }
  .project-view button{ font-family:inherit; color:inherit; background:none; border:none; padding:0; }


  /* ════════ CARD PERSONAL: "tu cielo" (Aries, /sobre-mi) ════════
     Se abre desde la card con tu foto, distinto a los proyectos: una lente
     redonda (como una lupa) que se agranda desde la card sobre la
     constelación de Aries. Fondo negro azulado con grano de universo y
     apenas luz. Línea de la constelación muy fina; las estrellas son el
     mismo punto con glow del cursor, de distintos tamaños según su brillo
     real. Cada estrella abre una parte tuya. */
  .about-view{
    position:fixed; inset:0; z-index:300;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,5,8,0.55);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    opacity:0; visibility:hidden;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
    font-family:var(--font); color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  .about-view.is-open{ opacity:1; visibility:visible; transition: opacity 0.4s ease, visibility 0s; }
  .about-view button{ font-family:inherit; color:inherit; background:none; border:none; padding:0; }

  /* igual que la flecha del proyecto: tinta a --m de arriba y de la izquierda,
     área de click de ~64px (el padding va con .about-view para ganarle al reset de botones) */
  .about-view .about-close{ padding:22px; margin:-22px; }
  html.is-narrow .about-view .about-close{ top:calc(env(safe-area-inset-top, 0px) + 32px); left:24px; font-size:17.71px; }
  .about-close{
    position:absolute; top:calc(var(--m) - 3.3px); left:calc(var(--m) - 2.3px); z-index:2;
    font-size:20px; line-height:1;
    opacity:0.85; transition:opacity 0.2s ease;
  }
  html.can-hover .about-close:hover{ opacity:1; }

  .about-lens{
    --lens: min(86vmin, 640px);
    position:relative; width:var(--lens); height:var(--lens);
    border-radius:50%; overflow:hidden;
    background:
      radial-gradient(circle at 34% 28%, rgba(120,140,255,0.06), transparent 30%),
      radial-gradient(circle at 30% 35%, rgba(0,18,255,0.16), transparent 58%),
      radial-gradient(circle at 75% 80%, rgba(0,18,255,0.09), transparent 50%),
      #030307;
    box-shadow: 0 0 0 1px rgba(248,247,239,0.18), 0 0 60px rgba(0,18,255,0.18), inset 0 0 80px rgba(0,0,0,0.85);
    transform-origin:center;
    transition: transform 0.6s cubic-bezier(.2,.75,.2,1), opacity 0.4s ease;
  }
  /* grano de universo: ruido fino generado (no es una foto) */
  .about-lens::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.62  0 0 0 0 0.68  0 0 0 0 1  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:0.35; mix-blend-mode:screen;
  }
  /* brillo de vidrio de la lupa */
  .about-lens::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:3; border-radius:50%;
    background: radial-gradient(circle at 30% 22%, rgba(255,255,255,0.07), transparent 38%);
  }
  .about-sky{
    position:absolute; inset:0; z-index:1;
    transform: translate(calc(var(--px, 0) * 10px), calc(var(--py, 0) * 10px));
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
  }
  .about-dust{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    transform: translate(calc(var(--px, 0) * 4px), calc(var(--py, 0) * 4px));
    transition: transform 0.8s cubic-bezier(.2,.7,.2,1);
  }
  .about-dust i{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:rgba(200,210,255,0.55); transform:translate(-50%,-50%);
  }
  .about-lines{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  .about-lines polyline{
    fill:none; stroke:rgba(248,247,239,0.6); stroke-width:0.14; /* ~0.9px en una lente de 640px */
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  .about-view.is-drawn .about-lines polyline{ stroke-dashoffset:0; transition: stroke-dashoffset 1.6s cubic-bezier(.45,0,.2,1); }

  /* ".about-view .about-star" y no ".about-star": la regla de botones de la
     vista (background:none) le sacaba el degradé y quedaba un disco oscuro */
  .about-view .about-star{
    position:absolute; transform:translate(-50%,-50%);
    width:var(--s); height:var(--s); border-radius:50%;
    background: radial-gradient(circle, rgba(248,247,239,1) 0%, rgba(205,215,255,0.95) 18%, rgba(60,80,255,0.75) 40%, rgba(0,18,255,0.25) 68%, rgba(0,18,255,0) 100%);
    box-shadow: 0 0 calc(var(--s) * 0.9) rgba(60,80,255,0.55);
    opacity:0; transition: opacity 0.5s ease, transform 0.35s cubic-bezier(.2,.8,.2,1.2);
    cursor:pointer;
  }
  .about-star::before{ content:''; position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%); border-radius:50%; }
  .about-view.is-drawn .about-star{ opacity:1; }
  .about-star.is-active{ transform:translate(-50%,-50%) scale(1.45); }
  html.can-hover .about-star:hover{ transform:translate(-50%,-50%) scale(1.25); }
  .about-star-name{
    position:absolute; left:calc(100% + 8px); top:50%; transform:translateY(-50%);
    font-family:'Courier New', monospace; font-size:9px; letter-spacing:0.12em; white-space:nowrap;
    color:var(--cream); opacity:0.45; pointer-events:none;
  }
  .about-star.is-active .about-star-name{ opacity:0.9; }
  .about-star-name.is-left{ left:auto; right:calc(100% + 8px); }

  .about-text{
    position:absolute; left:16%; right:16%; top:60%; z-index:2;
    text-align:center;
  }
  .about-kicker{ font-family:'Courier New', monospace; font-size:10px; letter-spacing:0.14em; opacity:0.55; margin:0 0 10px; }
  .about-title{ font-size:11px; font-weight:400; letter-spacing:0.16em; text-transform:uppercase; margin:0 0 10px; opacity:0.85; }
  .about-coords{ font-family:'Courier New', monospace; font-size:10px; letter-spacing:0.1em; opacity:0.4; margin:0 0 12px; }
  .about-coords:empty{ display:none; }
  .about-body{ font-size:clamp(13px, 2.1vmin, 16px); line-height:1.45; margin:0; opacity:0.92; }
  .about-links{ display:flex; justify-content:center; gap:18px; margin-top:12px; font-size:12px; letter-spacing:0.08em; }
  .about-links:empty{ display:none; }
  .about-links a{ color:inherit; text-decoration:none; opacity:0.85; }
  html.can-hover .about-links a:hover{ opacity:1; }
  .about-text > *{ transition: opacity 0.3s ease; }
  .about-text.is-swapping > *{ opacity:0 !important; }

  /* celular: en una lente de ~340px los textos no entran adentro del
     círculo; la constelación se centra en la lente y el texto va debajo */
  html.is-narrow .about-view{ flex-direction:column; }
  html.is-narrow .about-lens{ --lens: min(88vw, 56vh); overflow:visible; margin-top:-12vh; }
  html.is-narrow .about-lens::before{ border-radius:50%; }
  html.is-narrow .about-sky{ inset:16% 0 -16% 0; }
  html.is-narrow .about-text{ left:50%; right:auto; top:calc(100% + 22px); width:min(86vw, 360px); transform:translateX(-50%); }
  html.is-narrow .about-body{ font-size:14px; }

  @media (prefers-reduced-motion: reduce){
    .about-lens, .about-sky, .about-dust{ transition:none; }
    .about-lines polyline{ stroke-dashoffset:0; }
    .about-star{ opacity:1; }
  }

  /* -------- transición hero ↔ proyecto (ver enterProjectView / leaveProjectView) --------
     .pv-flyer: la imagen que viaja entre la card del hero y el carrusel; va
     por encima de todo (hero 100, proyecto 200) salvo cursor e idioma.
     .pv-chrome-out: panel/barra de info, volver, contador y contacto
     afuera; al sacarla entran con transición.
     .pv-feed-hidden: el feed invisible mientras la imagen viaja (si no, la
     foto real aparecería antes de que llegue la que vuela). */
  .pv-flyer{ position:fixed; z-index:260; pointer-events:none; overflow:hidden; }
  .pv-flyer img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity 0.35s ease; }
  .project-view.pv-flying{ transition: opacity 0.3s ease, visibility 0s; }
  .pv-feed{ transition: opacity 0.3s ease; }
  .project-view.pv-feed-hidden .pv-feed{ opacity:0; }
  .pv-info{ transition: transform 0.55s cubic-bezier(.2,.7,.2,1), opacity 0.45s ease; }
  .pv-back, .pv-counter, .pv-index{ transition: opacity 0.45s ease; }
  .project-view.pv-chrome-out .pv-info{ transform:translateX(-28px); opacity:0; }
  html.is-narrow .project-view.pv-chrome-out .pv-info{ transform:translateY(-100%); opacity:1; }
  .project-view.pv-chrome-out .pv-back,
  .project-view.pv-chrome-out .pv-counter{ transition:none !important; }
  .project-view.pv-chrome-out .pv-back,
  .project-view.pv-chrome-out .pv-counter,
  .project-view.pv-chrome-out .pv-contact{ opacity:0 !important; }
  @media (prefers-reduced-motion: reduce){
    .pv-info{ transition:none; }
  }

  /* "+ info" en celular, sin cortina (elegida la B): la máscara se abre de
     golpe, el fondo del panel (en un ::before) se funde y los textos entran
     en cascada subiendo apenas. La clase pv-sheet-fade la pone el JS. */
  html.is-narrow.pv-sheet-fade .pv-info{
    background: linear-gradient(#07070a, #07070a) 0 0 / 100% var(--pv-bar-h, 120px) no-repeat;
  }
  html.is-narrow.pv-sheet-fade .pv-info::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 15% 100%, rgba(0,18,255,0.38) 0%, transparent 70%),
      #07070a;
    opacity:0; transition: opacity 0.3s ease 0.06s;
  }
  html.is-narrow.pv-sheet-fade .pv-info.is-expanded::before{ opacity:1; transition: opacity 0.5s ease; }
  html.is-narrow.pv-sheet-fade .pv-desc,
  html.is-narrow.pv-sheet-fade .pv-links,
  html.is-narrow.pv-sheet-fade .pv-row{
    opacity:0; transform:translateY(10px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  html.is-narrow.pv-sheet-fade .pv-info.is-expanded .pv-desc,
  html.is-narrow.pv-sheet-fade .pv-info.is-expanded .pv-links,
  html.is-narrow.pv-sheet-fade .pv-info.is-expanded .pv-row{
    opacity:1; transform:none;
    transition: opacity 0.7s ease var(--d), transform 0.8s cubic-bezier(.2,.7,.2,1) var(--d);
  }
  html.is-narrow.pv-sheet-fade .pv-desc{ --d:0.15s; }
  html.is-narrow.pv-sheet-fade .pv-links{ --d:0.27s; }
  html.is-narrow.pv-sheet-fade .pv-row:nth-child(1){ --d:0.39s; }
  html.is-narrow.pv-sheet-fade .pv-row:nth-child(2){ --d:0.51s; }
  html.is-narrow.pv-sheet-fade .pv-row:nth-child(3){ --d:0.63s; }

  /* entrada del panel de info desde el hero (elegida la C, "telemetría"):
     el fondo del panel ya está; los textos entran en cascada y los de arriba
     además se decodifican (JS: scramble). La clase pv-telemetry la pone el JS. */
  html.pv-telemetry .project-view.pv-chrome-out .pv-info.pv-info{ transform:none; opacity:1; }
  html.pv-telemetry .pv-title, html.pv-telemetry .pv-kind, html.pv-telemetry .pv-meta, html.pv-telemetry .pv-coords, html.pv-telemetry .pv-info-toggle,
  html.pv-telemetry:not(.is-narrow) .pv-index,
  html.pv-telemetry:not(.is-narrow) .pv-desc, html.pv-telemetry:not(.is-narrow) .pv-links, html.pv-telemetry:not(.is-narrow) .pv-row{
    transition: opacity 0.8s ease var(--pd, 0s);
  }
  html.pv-telemetry .project-view.pv-chrome-out :is(.pv-title, .pv-kind, .pv-meta, .pv-coords, .pv-info-toggle),
  html.pv-telemetry:not(.is-narrow) .project-view.pv-chrome-out :is(.pv-index, .pv-desc, .pv-links, .pv-row){
    opacity:0; transition:none;
  }
  html.pv-telemetry .pv-title{ --pd:0.15s; }
  html.pv-telemetry .pv-index{ --pd:0.2s; }
  html.pv-telemetry .pv-kind{ --pd:0.22s; }
  html.pv-telemetry .pv-meta{ --pd:0.27s; }
  html.pv-telemetry .pv-coords{ --pd:0.37s; }
  html.pv-telemetry .pv-info-toggle, html.pv-telemetry .pv-desc{ --pd:0.45s; }
  html.pv-telemetry .pv-links{ --pd:0.57s; }
  html.pv-telemetry .pv-row:nth-child(1){ --pd:0.67s; }
  html.pv-telemetry .pv-row:nth-child(2){ --pd:0.77s; }
  html.pv-telemetry .pv-row:nth-child(3){ --pd:0.87s; }
  @media (prefers-reduced-motion: reduce){
    html.is-narrow.pv-sheet-fade .pv-info *, html.pv-telemetry .pv-info *{ transition:none !important; transform:none !important; }
  }

  /* solo la flecha (15.4px + 30%); "Salir de órbita" queda como aria-label.
     Área de click de ~64px sin mover la flecha de lugar (el padding va con
     .project-view para ganarle al reset de botones). Alineada con los textos. */
  .project-view .pv-back{ padding:22px; margin:-22px; }
  .pv-back{
    /* la tinta de la flecha (20px) arranca 3.3px abajo y 2.3px a la derecha de la caja:
       se compensa para que lo que se ve quede a --m de arriba y de la izquierda */
    position:absolute; top:calc(var(--m) - 3.3px); left:calc(var(--m) - 2.3px); z-index:3;
    font-size:20px; line-height:1;
    opacity:0.85; transition:opacity 0.2s ease;
  }
  html.can-hover .pv-back:hover{ opacity:1; }

  /* panel de info: un solo panel ancho desde el borde de la pantalla
     (volver y sello arriba, título y descripción, campos abajo de todo).
     Fondo casi negro + atmósfera azul fija que nace abajo a la izquierda
     (15% 100%) y se apaga hacia arriba/derecha antes del feed; siempre el
     mismo azul, no depende del proyecto. Como el panel arranca en el borde
     de la pantalla no hay ningún borde interno que la corte. Va como fondo
     del panel (no en un ::before) para quedar quieta si el panel scrollea. */
  .pv-info{
    position:absolute; top:0; bottom:0; left:0; width:var(--pv-panel);
    z-index:2;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse 90% 60% at 15% 100%, rgba(0,18,255,0.38) 0%, transparent 70%),
      #07070a;
    color:var(--cream);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    /* abajo: la línea de base del último renglón queda a --m (como el © y el ES/EN);
       el texto de 13px tiene ~4.5px de aire bajo la base dentro de su renglón */
    padding:calc(var(--m) + 64px) var(--pv-pad) calc(var(--m) - 4.5px);
    overflow-y:auto; scrollbar-width:none;
  }
  .pv-info::-webkit-scrollbar{ display:none; }
  .pv-title{
    font-weight:400; font-size:clamp(14.4px, 1.584vw, 30.72px);
    text-transform:uppercase;
    line-height:1.05; letter-spacing:0.01em; margin:0 0 12px;
  }
  /* qué es el proyecto (bodegón, joyería, productora…): destacado entre el título y año / tipo */
  .pv-kind{
    font-size:clamp(13px, 1.05vw, 17px); line-height:1.3; letter-spacing:0.005em;
    margin:-4px 0 14px; opacity:0.9;
  }
  .pv-kind[hidden]{ display:none; }
  html.is-narrow .pv-kind{ font-size:14px; margin:-2px 0 10px; padding-right:80px; }
  .pv-meta{
    font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    opacity:0.7; display:flex; gap:10px;
  }
  /* sello "CX-01" en pastilla, arriba a la derecha del panel (guiño a CAMUXI) */
  .pv-index{
    position:absolute; top:var(--m); right:var(--pv-pad);
    font-size:10px; letter-spacing:0.12em;
    border:1px solid rgba(248,247,239,0.4); border-radius:999px; padding:5px 11px;
    opacity:0.85;
  }
  /* coordenadas del proyecto: línea chica tipo telemetría bajo año/tipo;
     si el proyecto no tiene coords no se renderiza (hidden) */
  .pv-coords{
    font-family:'Courier New', monospace;
    font-size:10px; letter-spacing:0.1em;
    opacity:0.55; /* más legible (antes 0.4: muy poco contraste a 10px) */
    margin-top:8px;
  }
  .pv-coords[hidden]{ display:none; }
  .pv-info-toggle{ display:none; }
  .pv-body{ flex:1; display:flex; flex-direction:column; margin-top:clamp(36px, 4vw, 64px); }
  /* max-width 29.5em ≈ tope de 10 palabras por renglón (medido; al ir
     en em acompaña el tamaño de letra); en notebooks el panel corta antes */
  .pv-desc[hidden]{ display:none; }
  .pv-desc{ font-size:21.56px; line-height:1.4; font-weight:400; opacity:0.85; margin:0 0 40px; max-width:29.5em; }
  /* links del proyecto ("↗ Instagram") debajo de la descripción */
  .pv-links{ display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:-16px; margin-bottom:40px; font-size:13px; letter-spacing:0.08em; }
  .pv-links:empty{ display:none; }
  .pv-links a{ color:inherit; text-decoration:none; opacity:0.85; transition:opacity 0.2s ease; }
  html.can-hover .pv-links a:hover{ opacity:1; }
  /* cliente / servicios / créditos: apilados abajo de todo del panel */
  .pv-rows{ margin-top:auto; }
  .pv-rows[hidden]{ display:none; }
  /* proyecto sin esos campos: la descripción (y sus links) bajan a ocupar
     ese lugar, abajo de todo */
  .pv-body.is-desc-bottom .pv-desc{ margin-top:auto; }
  .pv-body.is-desc-bottom .pv-links{ margin-bottom:0; }
  .pv-row{ padding:14px 0 16px; }
  .pv-row:last-child{ padding-bottom:0; } /* el margen de abajo lo da el panel */
  .pv-label{
    color:var(--cream); opacity:0.7; /* misma opacidad que año/tipo y el legal del footer */
    font-size:10px; font-weight:400; letter-spacing:0.15em; text-transform:uppercase;
    margin:0 0 6px;
  }
  /* todos los valores bajo los labels con la misma tipografía, en regular */
  .pv-val{ font-size:14px; line-height:1.45; font-weight:400; }
  .pv-credit + .pv-credit{ margin-top:10px; }
  .pv-credit b{ display:block; font-weight:400; }

  .pv-feed{
    position:absolute; top:0; bottom:0; right:0;
    left:var(--pv-panel);
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:none;
  }
  .pv-feed::-webkit-scrollbar{ display:none; }
  .pv-item{ display:block; width:100%; background:#0a0a0a; }
  .pv-item img, .pv-item video{ display:block; width:100%; height:100%; object-fit:cover; }
  /* videos: el fondo del video es #111, el del slide también (sin borde visible) */
  .pv-item.is-video, .pv-item video{ background:#111; }

  /* contador circular: anillo de progreso + n / total */
  .pv-counter{
    position:absolute; top:var(--pv-pad); right:var(--pv-pad);
    width:52px; height:52px; z-index:3;
    isolation:isolate;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:0.02em;
  }
  .pv-counter svg{ position:absolute; inset:0; transform:rotate(-90deg); }
  /* overlay negro debajo del contador (mancha desenfocada que se desvanece hacia afuera, sin borde
     duro) al 8% de opacidad, para que el número no se pierda sobre fotos claras */
  .pv-counter::before{
    content:''; position:absolute; inset:-22px; z-index:-1;
    border-radius:50%;
    background: radial-gradient(closest-side, rgba(0,0,0,0.08), rgba(0,0,0,0.045) 55%, rgba(0,0,0,0) 100%);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    -webkit-mask-image: radial-gradient(closest-side, #000 40%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 40%, transparent 100%);
    pointer-events:none;
  }
  .pv-counter circle{ fill:none; stroke:var(--cream); stroke-width:1.5; }
  .pv-counter .pv-counter-track{ opacity:0.22; }
  .pv-counter .pv-counter-bar{ transition: stroke-dashoffset 0.35s ease; }
  .pv-counter-total{ opacity:0.55; margin-left:1px; }

  /* contacto: el "CX" del favicon flotando, sin caja ni borde ni texto
     (la palabra va solo como aria-label). Lleva al footer real. El botón
     queda fijo a la derecha y centrado en vertical; lo único que se
     anima es translateY de la marca de adentro (±5px, 5s, ease-in-out),
     así nunca puede salirse de su lugar. Va en crema, sin halo. */
  .pv-contact{
    /* excepción al margen: el CX es más angosto, así que va centrado en el mismo eje
       vertical que el contador (52px a --m del borde: centro a --m + 26px) */
    position:fixed; right:calc(var(--m) + 4px); top:50%; z-index:201; /* por encima de la vista de proyecto (z-index 200) */
    transform:translateY(-50%);
    width:44px; height:44px;
    display:none; align-items:center; justify-content:center;
    font-family:inherit; color:var(--cream); background:none; border:none; padding:0; cursor:pointer;
    opacity:0.9; transition:opacity 0.4s ease;
  }
  html.project-open .pv-contact{ display:flex; }
  /* panel de info abierto (celular): el CX se esconde y reaparece cuando la cortina terminó de cerrar */
  html.is-narrow .pv-contact.is-under-panel{ opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  html.can-hover .pv-contact:hover{ opacity:1; }
  .pv-contact-mark{
    position:relative;
    display:block; width:30.4px; line-height:0; /* 38px − 20% */
    animation: pv-contact-float 5s ease-in-out infinite alternate;
  }
  .pv-contact-mark > svg{ display:block; width:100%; height:auto; fill:var(--cream); }

  /* hover (solo con mouse): "CONTACTAME" orbita alrededor del CX como su
     luna — la palabra va curvada sobre un círculo invisible (textPath) y
     el círculo gira lento. Vive dentro de la marca, así acompaña su
     flotación. Mismo estilo que el texto flotante del footer. En touch no
     hay hover: la palabra no aparece nunca. */
  .pv-contact-orbit{
    position:absolute; left:50%; top:50%;
    width:88px; height:88px; margin:-44px 0 0 -44px;
    pointer-events:none;
    opacity:0; transition:opacity 0.35s ease;
    animation: pv-contact-orbit 9s linear infinite;
  }
  .pv-contact-orbit svg{ display:block; width:100%; height:100%; overflow:visible; }
  .pv-contact-orbit text{
    fill:var(--cream); fill-opacity:0.6;
    font-family:var(--font); font-size:9px; letter-spacing:1.1px; text-transform:uppercase;
  }
  html.can-hover .pv-contact:hover .pv-contact-orbit,
  html.can-hover .pv-contact:focus-visible .pv-contact-orbit{ opacity:1; }
  @keyframes pv-contact-orbit{
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes pv-contact-float{
    from { transform: translateY(-5px); }
    to   { transform: translateY(5px); }
  }
  @media (prefers-reduced-motion: reduce){
    .pv-contact-mark, .pv-contact-orbit{ animation:none; }
  }

  /* celular: barra arriba + feed a pantalla completa (como la referencia) */
  /* alineada con el selector de idioma (mismo top y mismo margen de 32px, pero del lado izquierdo); flecha +15% */
  /* arriba a 32px; su centro (41px) coincide con el del ES/EN. El padding de 14px (área de toque de 44px)
     lo pisaba `.project-view button{ padding:0 }` y el margin negativo la subía 14px: se fuerza con más especificidad */
  html.is-narrow .project-view .pv-back{ padding:22px; margin:-22px; }
  html.is-narrow .pv-back{ top:calc(env(safe-area-inset-top, 0px) + 32px); left:24px; width:auto; font-size:17.71px; }
  /* el panel ocupa siempre toda la pantalla pero se ve recortado por una máscara:
     cerrado = solo la barra de arriba; "+ info" corre el borde inferior hacia
     abajo con la misma cortina de panza difuminada del footer (JS: applySheet
     pone --sh-edge/--sh-curve/--sh-r/--sh-blur). Cerrado no tapa los toques. */
  html.is-narrow .pv-info{
    --sh-edge: var(--pv-bar-h, 120px);
    left:0; right:0; width:auto; bottom:0;
    padding:69px 24px 16px; overflow:hidden; /* +2px: aire entre la fila de arriba (flecha / ES-EN) y el título */ /* el título (17.24px, interlineado 1.05 → 18.1px) queda centrado a 76px, en la línea del CX-XX y del nombre del hero */
    pointer-events:none;
    /* el glow azul queda en el margen inferior izquierdo del panel (igual que en desktop,
       heredado de .pv-info) y se destapa con la cortina al abrir */
    -webkit-mask-image: radial-gradient(circle var(--sh-r, 99999px) at 50% calc(var(--sh-edge) + var(--sh-curve, 0px) - var(--sh-r, 99999px)), #000 calc(var(--sh-r, 99999px) - 1px), transparent calc(var(--sh-r, 99999px) + var(--sh-blur, 0px))), linear-gradient(#000, #000);
            mask-image: radial-gradient(circle var(--sh-r, 99999px) at 50% calc(var(--sh-edge) + var(--sh-curve, 0px) - var(--sh-r, 99999px)), #000 calc(var(--sh-r, 99999px) - 1px), transparent calc(var(--sh-r, 99999px) + var(--sh-blur, 0px))), linear-gradient(#000, #000);
    -webkit-mask-size: 100% 100%, 100% var(--sh-edge);
            mask-size: 100% 100%, 100% var(--sh-edge);
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-position: 0 0;
            mask-position: 0 0;
  }
  html.is-narrow .pv-info.is-expanded{ pointer-events:auto; }
  html.is-narrow .pv-info.is-expanded.is-scrollable{ overflow-y:auto; }
  html.is-narrow .pv-title{ font-size:17.24px; margin-bottom:8px; padding-right:80px; }
  /* el sello CX-XX no va en la barra colapsada (mucho texto para una pantalla chica); aparece con un fade-in suave al desplegar la info */
  html.is-narrow .pv-index{
    top:64px; right:24px; /* arriba a la derecha está el ES/EN */
    line-height:12px; /* alto fijo: 12 + 10 de padding + 2 de borde = 24px, centro a 76px */
    opacity:0; visibility:hidden;
    transition: opacity 0.3s ease, visibility 0s linear 0.3s;
  }
  html.is-narrow .pv-info.is-expanded .pv-index{
    opacity:0.85; visibility:visible;
    transition: opacity 0.9s ease 0.45s, visibility 0s;
  }
  /* año / tipo y coordenadas siempre visibles; el + info va debajo, así no salta al abrir */
  html.is-narrow .pv-info-toggle{
    margin-top:15.4px; pointer-events:auto; /* mismo aire sobre "+ info" que entre la fila de arriba y el título (~25px de tinta a tinta) */
    display:inline-flex; gap:6px; align-items:center;
    font-size:14px; font-weight:400; color:#F5CD0A; /* amarillo complementario del azul (el mismo del punto del cursor en el footer) */
  }
  /* el + y el - son svg de la misma caja de 10×10px (el − centrado): al cambiar no varía el ancho
     y "info" no se mueve. Cruzan con un fade corto. */
  /* top:1px: medido a 14px, el centro de "info" (entre el centro de la altura total, +0.5px, y el de la x, +1.9px)
     queda ~1px más abajo que el centro de la caja, así que el símbolo baja 1px para centrarse con el texto */
  .pv-info-icon{ position:relative; top:1px; display:inline-block; width:10px; height:10px; flex:none; }
  .pv-info-icon svg{ position:absolute; left:0; fill:currentColor; transition:opacity 0.25s ease; }
  .pv-ico-plus{ top:0; opacity:1; }
  .pv-ico-minus{ top:4px; opacity:0; }
  .pv-info.is-expanded .pv-ico-plus{ opacity:0; }
  .pv-info.is-expanded .pv-ico-minus{ opacity:1; }
  /* el cuerpo está siempre en el layout (la máscara lo revela); oculto a lectores/tab mientras está cerrado */
  html.is-narrow .pv-body{ visibility:hidden; transition: visibility 0s linear 1.1s; }
  html.is-narrow .pv-info.is-expanded .pv-body{ visibility:visible; transition:none; }
  html.is-narrow .pv-feed{ left:0; top:var(--pv-bar-h, 120px); }
  html.is-narrow .pv-counter{ top:calc(var(--pv-bar-h, 120px) + 14px); right:24px; z-index:1; }
  /* abajo a la derecha, con 32px de margen a la marca (el botón de 44px tiene ~6.8px de aire alrededor) */
  /* misma posición que la firma CAMUXI del footer: borde derecho a 24px y centro vertical en su línea
     (CAMUXI: 18.15px de alto a 32px del borde de abajo → centro a 41.1px; la marca CX mide 30.4×22.3px
     dentro de un botón de 44px → right 24−6.8 = 17.2px, bottom 41.1−22 = 19.1px) */
  html.is-narrow .pv-contact{ right:17.2px; left:auto; top:auto; bottom:19.1px; transform:none; }
  /* el contador va por debajo del panel de info (z-index 1 < 2): con la info abierta
     queda tapado y la cortina lo tapa/destapa a su paso, sin saltos */

  /* con un proyecto abierto la página scrollea (para destapar el footer)
     aunque se haya entrado directo sin pasar por el loader. El selector
     de idioma sigue visible (en desktop abajo a la derecha, en celular
     arriba a la derecha) y cambia también los textos del proyecto. */
  html.project-open{ overflow-y:auto; }
  body.project-open{ overflow-y:visible; height:auto; min-height:100%; }
  body.project-open .lang-switch{ opacity:1; visibility:visible; transition: opacity 0.35s ease, visibility 0s; }

  /* escondido durante el loader (en todos los tamaños) y aparece con
     el mismo fade que el resto del stage (stage-active). visibility
     va con delay al esconderse para que el fade termine antes, y sin
     delay al mostrarse; mientras está invisible no se puede tocar. */
  .lang-switch{
    position:fixed; bottom:32px; right:32px; z-index:9999;
    display:flex; gap:10px;
    font-family:var(--font);
    opacity:0; visibility:hidden;
    transition: opacity 1s ease, visibility 0s linear 1s;
  }
  body.stage-active .lang-switch{
    opacity:1; visibility:visible;
    transition: opacity 1s ease, visibility 0s;
  }
  /* celular: abajo a la derecha ahora va la firma CAMUXI, así que el
     selector sube a la esquina de arriba a la derecha, por encima del
     nombre (centrado a 76px del borde). Texto de ~10px: top 36 → centro a 41px. */
  html.is-narrow .lang-switch{ bottom:auto; top: calc(env(safe-area-inset-top, 0px) + 36px); right:24px; }
  html.is-narrow .lang-btn{ font-size:10.8px; } /* +20%: a 9px se veía muy chico */
  .lang-btn{
    position:relative;
    background:none; border:none; padding:0; margin:0;
    font-family:inherit; color:var(--cream);
    font-size:clamp(9px, 0.7vw, 11px);
    letter-spacing:0.05em;
    font-weight:300; opacity:0.3;
    cursor:pointer; transition:opacity 0.3s ease, color 0.3s ease;
  }
  .lang-btn.active{ font-weight:700; opacity:1; }
  /* área de toque de 44×44px sin cambiar cómo se ve: una caja invisible
     alrededor de cada botón. Las dos cajas se reparten el espacio en la
     mitad del gap (10px / 2): ES crece hacia la izquierda y EN hacia la
     derecha, así no se pisan y tocar una letra nunca activa la otra. */
  .lang-btn::before{
    content:''; position:absolute; top:50%;
    width:44px; height:44px; transform:translateY(-50%);
  }
  .lang-btn:first-child::before{ right:-5px; }
  .lang-btn:last-child::before{ left:-5px; }
  /* al hacer hover en el no seleccionado, se pone azul y sube su
     opacidad para que el azul se lea bien (a 30% quedaba casi
     invisible sobre el fondo) — el seleccionado no reacciona al hover */
  .lang-btn:not(.active):hover{ color:var(--blue); opacity:0.85; }
  @media (prefers-reduced-motion: reduce){
    .footer-contact-label{ animation: none; }
  }

  
  .pv-coords-body{ display:none; }
  /* el nombre del hero mientras su copia viaja (le gana a la visibilidad que pone el scroll del footer) */
  #name-text.pv-name-away{ visibility:hidden !important; }
  .pv-name-flyer{
    position:fixed; left:0; top:0; z-index:270; pointer-events:none;
    color:var(--cream); font-family:var(--font); text-transform:uppercase; white-space:nowrap;
    transform-origin:0 0; line-height:1.05; letter-spacing:0.01em;
    text-shadow:0 0 1px rgba(0,0,0,0.35), 0 1px 14px rgba(0,0,0,0.45); /* que se lea mientras pasa por encima de la foto */
  }
  /* ════ proyecto: botones flotantes de vidrio (compu y celu; en el celu acostado sigue el layout de antes) ════
     html.pv-pill.pv-split: la flecha, el nombre y el contador son tres píldoras sueltas
     de vidrio ahumado con un canto azul. El nombre abre la info, una segunda píldora
     12px debajo, a la derecha. (Las reglas con :not(.pv-split) son de la barra única,
     que quedó sin uso.) */
  html.pv-pill:not(.is-landscape-phone) .project-view{
    --pill-h:60px; --pill-side:24px; --pill-top:24px; --pill-gap:10px; --pill-r:30px; --pill-card-r:24px;
    --g-bg:rgba(8,8,12,0.55); --g-filter:blur(26px) saturate(1.05); --g-color:var(--cream);
    --g-shadow:inset 0 1px 0 rgba(255,255,255,0.10);
    --g-rim:linear-gradient(140deg, rgba(150,165,255,0.95), rgba(0,18,255,0.25) 35%, rgba(0,18,255,0.05) 65%, rgba(40,60,255,0.85));
    --g-rim-w:1px;
  }
  html.pv-pill.is-narrow .project-view{
    --pill-h:48px; --pill-side:12px; --pill-top:calc(env(safe-area-inset-top, 0px) + 12px); --pill-gap:8px; --pill-r:24px; --pill-card-r:20px;
  }
  /* las superficies de vidrio: en "barra" la barra; en "botones" el nombre y "+ info"; siempre la flecha y la info */
  html.pv-pill:not(.is-landscape-phone, .pv-split) .pv-head,
  html.pv-pill.pv-split:not(.is-landscape-phone) :is(.pv-title, .pv-info-toggle),
  html.pv-pill:not(.is-landscape-phone) :is(.pv-body, .project-view .pv-back){
    background:var(--g-bg); color:var(--g-color);
    -webkit-backdrop-filter:var(--g-filter); backdrop-filter:var(--g-filter);
    box-shadow:var(--g-shadow); border:0;
  }
  /* el canto: un aro con degradé (más claro en dos esquinas, como un borde de metal o vidrio) */
  html.pv-pill:not(.is-landscape-phone, .pv-split) .pv-head::after,
  html.pv-pill.pv-split:not(.is-landscape-phone) :is(.pv-title, .pv-info-toggle)::after,
  html.pv-pill:not(.is-landscape-phone) :is(.pv-body, .project-view .pv-back)::after{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; padding:var(--g-rim-w);
    background:var(--g-rim);

<!-- celular girado: Safari pinta las franjas de los costados (zona de la cámara)
     con el color del último elemento fijo pegado arriba, y lo decide en el PRIMER
     dibujo de la página. Esta línea transparente va después de todas las capas
     fijas (loader, proyecto, footer) y antes del código, así ya está en ese primer
     dibujo: Safari no encuentra color y usa el fondo de la página (oscuro). -->
<div class="edge-probe" aria-hidden="true"></div>
<script>
/* -------- favicon adaptativo: CX azul en light mode, CX crema
   en dark mode. El truco de @media dentro del propio SVG del
   favicon NO lo respeta Chrome para el ícono de la pestaña, así
   que se hace por JS: se escucha matchMedia y se pisa el href del
   <link> — esto sí lo soportan todos los navegadores modernos, y

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* -------- base responsive --------
   1) rama "con hover" vs "touch": se decide por CAPACIDAD del
      dispositivo, no por ancho de pantalla — una notebook táctil con
      mouse queda en la rama con hover, una tablet sin mouse en touch.
      html.can-hover / html.is-touch para el CSS, canHover para el JS.
      Se actualiza en vivo (ej. a una tablet se le conecta un mouse).
   2) alto estable (appH y la variable CSS --app-h): en mobile la barra
      de direcciones aparece y desaparece al scrollear y cambia
      window.innerHeight a cada rato; si el hero y el scroll usaran ese
      valor, toda la mecánica saltaría. Se mide el alto VISIBLE al cargar
      (con las barras del navegador a la vista, como se ve el loader) y
      en touch solo se vuelve a medir si cambia el ancho (rotación); con
      mouse, ante cualquier resize. (No se usa 100lvh: en navegadores
      cuyas barras no se esconden, el hero quedaba más alto que la
      pantalla y la frase del loader se escondía detrás de la barra.) -------- */
const hoverMQ = window.matchMedia('(hover: hover) and (pointer: fine)');
let canHover = hoverMQ.matches;
function applyInputMode(){
  canHover = hoverMQ.matches;

}
applyInputMode();

// celular girado (touch, bajo y ancho): hero con el carrusel plano del celu y

let landscapePhone = false;
/* celular girado: Safari pinta las franjas de los costados (la zona de la
   cámara) con el theme-color, aunque la página pida ocupar todo el ancho.
   Así que el theme-color sigue al fondo que se ve: azul mientras el loader
   está azul y en el footer, oscuro en el hero y en los proyectos. */
function updateThemeColor(){
  const meta = document.querySelector('meta[name="theme-color"]');
  if (!meta) return;
  let tc = '#0012FF';
  if (landscapePhone){
    const ld = document.getElementById('loader');
    const darkStage = (ld && ld.classList.contains('inverted')) || document.body.classList.contains('stage-active') || document.documentElement.classList.contains('project-open');
    const inFooter = window.scrollY >= window.innerHeight * 0.5; // (scrollP todavía no existe al cargar)
    if (darkStage && !inFooter) tc = '#111111';

}
function applyLandscapeMode(){
  landscapePhone = !canHover && window.innerHeight < 500 && window.innerWidth > window.innerHeight;
  document.documentElement.classList.toggle('is-landscape-phone', landscapePhone);

let appH = window.innerHeight;

function refreshAppH(){
  const w = window.innerWidth, h = window.innerHeight;

  if (!canHover && w === appW) return false;
  appW = w;
