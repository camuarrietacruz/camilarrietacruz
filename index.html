/* -------- referencias para el efecto de scroll (implosión + freeze
   del nombre + fade del subtítulo) -- se miden ACA, apenas carga la
   página y antes de que nada se mueva, porque tanto el centrado
   vertical del nombre (top:50% + translateY(-50%)) como la posición
   de los links del footer son fijos y no cambian con el intro. */
const subLocationEl = document.getElementById('sub-location');
const footerLinksEl = document.querySelector('.footer-links');

const copyYearEl = document.getElementById('copyYear');
if (copyYearEl) copyYearEl.textContent = new Date().getFullYear();
let scrollP = 0; // 0..1, progreso de scroll — lo lee también startOrbit()
// borde superior del nombre según el CSS: top (offsetTop, sin transform) - mitad del alto (translateY(-50%))
function measureNameStartTop(){ return nameText.offsetTop - nameText.offsetHeight / 2; }
let nameStartTop  = measureNameStartTop();
// del borde de arriba de la caja del nombre al de sus mayúsculas: en el footer
// lo que queda a --m del borde es la tinta, no la caja
function nameCapOffset(){
  const cs = getComputedStyle(nameText);
  const lh = nameText.offsetHeight, fs = parseFloat(cs.fontSize);
  const c = document.createElement('canvas').getContext('2d');
  c.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
  const m = c.measureText('H');
  const ascent = m.fontBoundingBoxAscent || fs * 0.8, descent = m.fontBoundingBoxDescent || fs * 0.2;
  // línea de base dentro de la caja (texto centrado en su line-height) menos la altura de mayúscula
  const baseline = (lh - (ascent + descent)) / 2 + ascent;
  return Math.max(0, baseline - m.actualBoundingBoxAscent);
}
let footerLinksTop = footerLinksEl ? footerLinksEl.getBoundingClientRect().top - nameCapOffset() : null;

// estos dos dependen del tamaño de viewport, asi que se recalculan en
// cada resize (ver el addEventListener('resize', ...) mas abajo, junto
// con el recentrado horizontal del nombre). nameStartTop se calcula con
// la formula del CSS (top:50% - mitad de su alto) y no con
// getBoundingClientRect(), porque en el momento del resize el nombre
// puede estar a mitad de camino del "freeze" del scroll — leer su
// posición actual ahí daría un valor contaminado por ese transform.
function refreshScrollLayoutRefs(){
  nameStartTop = measureNameStartTop();
  footerLinksTop = footerLinksEl ? footerLinksEl.getBoundingClientRect().top - nameCapOffset() : null;
}

// en celular el nombre está centrado desde el arranque del loader; se
// vuelve a centrar cuando termina de cargar la tipografía, porque antes
// se mide con la de reemplazo y queda unos px corrido
if (isNarrow) centerNameText();
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    if (isNarrow) centerNameText();
    refreshScrollLayoutRefs();
  });
}

function finalTransformValues(i){
  // todas las cards caen derechas, centradas, en la misma posición
  // exacta (sin offset diagonal ni rotación)
  return { tx: 0, ty: 0, rot: 0 };
}
function finalTransform(i){
  const v = finalTransformValues(i);
  return `translate(${v.tx}px, ${v.ty}px) rotate(${v.rot}deg)`;
}

function runLoader(){
  loader.classList.remove('inverted');
  tagline.classList.remove('fade-down');
  percentText.classList.remove('fade-out');
  percentText.textContent = '0%';
  ojito.style.opacity = '1';

  stackImgs.forEach(img => {
    img.classList.remove('fall');
    img.style.transition = 'none';
    img.style.opacity = '0';
    img.style.transform = 'translateY(-46px) rotate(0deg)';
    img.style.zIndex = 0;
  });

  // -------- ojito.gif: 900ms totales --------
  // el gif cambia de crema a azul EN SU frame 8 (arranca en 8*60=480ms) —
  // el fondo de la página tiene que invertir justo ahí, no al final
  const eyeDuration = 900;
  const invertAt = 480;
  setTimeout(() => { loader.classList.add('inverted'); }, invertAt);

  // -------- la primera foto reemplaza al ojo, después caen las demás --------
  const fallStart = eyeDuration + 20;
  const fallStep = 140;
  setTimeout(() => { ojito.style.opacity = '0'; }, fallStart);

  stackImgs.forEach((img, i) => {
    setTimeout(() => {
      img.style.zIndex = i + 1;
      // fuerza el estado inicial a pintarse ANTES de activar la
      // transición (doble rAF) para que ninguna tarjeta "salte" en
      // vez de caer
      img.getBoundingClientRect();
      requestAnimationFrame(() => {
        img.classList.add('fall');
        requestAnimationFrame(() => {
          img.style.opacity = '1';
          img.style.transform = finalTransform(i);
        });
      });
    }, fallStart + i * fallStep);
  });

  // -------- % contador, corre toda la carga --------
  const stackTotal = fallStart + stackImgs.length * fallStep + 350;
  let startTime = null;
  function tickPercent(ts){
    if (!startTime) startTime = ts;
    const t = Math.min(1, (ts - startTime) / stackTotal);
    percentText.textContent = Math.round((1 - Math.pow(1 - t, 3)) * 100) + '%';
    if (t < 1) {
      requestAnimationFrame(tickPercent);
    } else {
      setTimeout(finishLoader, 200);
    }
  }
  requestAnimationFrame(tickPercent);
}

/* ════════════════════════════════════════════
   100% → 1) la frase de abajo se va con fade hacia abajo
          2) el % desaparece
          3) el nombre (el mismo elemento del loader, mismo tamaño)
             se desplaza hacia el centro
          4) aparece el cursor custom
          5) las cards (las mismas del loader, desde donde quedaron)
             salen disparadas en explosión, con rebote, hacia su
             posición final
   Nada se oculta ni se vuelve a crear: son siempre los mismos
   elementos del loader, solo se les anima transform/left.
════════════════════════════════════════════ */
function finishLoader(){
  tagline.classList.add('fade-down');
  percentText.classList.add('fade-out');
  // en celular el nombre ya está centrado arriba: no viaja, la explosión
  // arranca directo en el mismo momento en que arrancaría el viaje
  setTimeout(isNarrow ? onNameHitsPile : (landscapePhone ? startNameRise : startNameTravel), 550);
}

const centerWrap = document.getElementById('center-wrap');

/* cursor custom: circulito + estela corta de puntitos (lightweight:
   unos pocos divs y un solo rAF, sin canvas ni librerías) */
const CURSOR_TRAIL = 4;
const cursorDots = [];
for (let i = 0; i <= CURSOR_TRAIL; i++){
  const d = document.createElement('div');
  d.className = 'cursor-dot';
  document.body.appendChild(d);
  cursorDots.push({ el: d, x: 0, y: 0, init: false });
}
let mouseX = 0, mouseY = 0;
let mouseSeen = false; // recién true con el primer mousemove post-loader (lo usa también el magnetismo de las cards)
let touchActive = false; // touch: hay un dedo apoyado (el punto y la estela lo siguen)

/* touch: el punto aparece donde se apoya el dedo, lo sigue (con la
   estela de partículas) mientras se arrastra, y se apaga al soltar.
   Al apoyar, el punto y la estela arrancan en el dedo — si no, viajarían
   desde donde quedó el toque anterior dejando un rastro falso. */
function onTouchPoint(e){
  if (canHover) return;
  const t = e.touches[0];
  if (!t) return;
  mouseX = t.clientX;
  mouseY = t.clientY;
  if (!touchActive){
    cursorDots.forEach(d => { d.x = mouseX; d.y = mouseY; d.init = true; });
    sparkLastX = mouseX; sparkLastY = mouseY; sparkAccum = 0;
  }
  touchActive = true;
  cursorDots.forEach(d => d.el.classList.add('visible'));
}
function onTouchEnd(e){
  if (e.touches.length) return;
  touchActive = false;
  cursorDots.forEach(d => d.el.classList.remove('visible'));
}

function onMouseMove(e){
  // en touch el navegador simula un mousemove en cada toque: lo maneja
  // onTouchPoint, así que acá se ignora (si no, el punto quedaba clavado)
  if (!canHover) return;
  mouseX = e.clientX;
  mouseY = e.clientY;
  mouseSeen = true;
  cursorDots.forEach(d => d.el.classList.add('visible'));
}

/* estela de partículas "cósmicas": polvo muy chico que va quedando
   atrás del punto principal mientras se mueve y se apaga solo. Un
   canvas 2D fijo a pantalla completa (debajo del punto), sin eventos.
   Se emite por distancia recorrida, no por frame: quieto no suelta
   nada, y moverse rápido deja una cola más larga. Azul sobre el hero,
   amarillo (mismo complementario que el punto) sobre el footer. */
const SPARK_EVERY_PX = 12;   // una partícula cada tantos px de recorrido
const SPARK_MAX = 50;       // tope de partículas vivas a la vez
const sparkCanvas = document.createElement('canvas');
sparkCanvas.className = 'spark-canvas';
sparkCanvas.style.cssText = 'position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:998;';
document.body.appendChild(sparkCanvas);
const sparkCtx = sparkCanvas.getContext('2d');
const sparks = [];
let sparkLastX = null, sparkLastY = null, sparkAccum = 0, sparkLastT = performance.now();
function sizeSparkCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  sparkCanvas.width = Math.round(window.innerWidth * dpr);
  sparkCanvas.height = Math.round(window.innerHeight * dpr);
  sparkCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeSparkCanvas();
window.addEventListener('resize', sizeSparkCanvas);

function tickSparks(x, y, overFooter){
  const now = performance.now();
  const dt = Math.min(50, now - sparkLastT);
  sparkLastT = now;
  if (mouseSeen || touchActive){
    if (sparkLastX === null){ sparkLastX = x; sparkLastY = y; }
    const dx = x - sparkLastX, dy = y - sparkLastY;
    const dist = Math.hypot(dx, dy);
    sparkAccum += dist;
    // reparte las partículas a lo largo del tramo recorrido este frame
    while (sparkAccum >= SPARK_EVERY_PX && sparks.length < SPARK_MAX){
      sparkAccum -= SPARK_EVERY_PX;
      const k = dist > 0 ? sparkAccum / dist : 0;
      const a = Math.random() * Math.PI * 2;
      const v = 0.006 + Math.random() * 0.018; // px por ms: deriva muy lenta
      sparks.push({
        x: x - dx * k + (Math.random() - 0.5) * 6,
        y: y - dy * k + (Math.random() - 0.5) * 6,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        r: 0.4 + Math.random() * 0.7,
        life: 0, ttl: 300 + Math.random() * 400,
        footer: overFooter
      });
    }
    if (sparks.length >= SPARK_MAX) sparkAccum = 0;
    sparkLastX = x; sparkLastY = y;
  }
  sparkCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life += dt;
    if (s.life >= s.ttl){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    const t = s.life / s.ttl;
    // aparece rápido y se apaga lento (titila apenas, como polvo)
    const alpha = Math.min(1, t * 6) * Math.pow(1 - t, 1.6) * (0.75 + 0.25 * Math.sin(s.life * 0.03 + i));
    sparkCtx.fillStyle = s.footer
      ? 'rgba(245,205,10,' + (alpha * 0.6) + ')'
      : 'rgba(110,130,255,' + (alpha * 0.55) + ')';
    sparkCtx.beginPath();
    sparkCtx.arc(s.x, s.y, s.r * (1 - t * 0.4), 0, Math.PI * 2);
    sparkCtx.fill();
  }
}

function tickCursor(){
  let px = mouseX, py = mouseY;
  // el footer (fondo azul) va destapándose de abajo hacia arriba a
  // medida que avanza scrollP — el límite visible está a esta altura
  // de pantalla. Si el cursor está por debajo, ya está sobre el
  // footer y necesita la variante oscura para no perderse en el azul.
  const footerBoundary = appH * (1 - scrollP);
  const overFooter = mouseY > footerBoundary;
  cursorDots.forEach((d, i) => {
    if (!d.init){ d.x = px; d.y = py; d.init = true; }
    const ease = i === 0 ? 0.55 : 0.4; // el punto principal sigue más de cerca
    d.x += (px - d.x) * ease;
    d.y += (py - d.y) * ease;
    // la estela crece y se desenfoca en vez de solo achicarse: eso es lo
    // que la hace leer como glow con profundidad y no como puntos planos
    const size = 14 * (1 + i * 0.32);
    const blur = i * 2.4;
    d.el.style.width  = size + 'px';
    d.el.style.height = size + 'px';
    // la opacidad inline pisa a la de .cursor-dot: sin chequear "visible"
    // el punto se veía siempre (en 0,0 antes de mover el mouse, y en touch
    // nunca se apagaba al soltar el dedo)
    const shown = d.el.classList.contains('visible');
    d.el.style.opacity = shown ? (i === 0 ? 1 : (0.5 - i * 0.09)) : 0;
    d.el.style.filter  = blur > 0 ? `blur(${blur}px)` : 'none';
    d.el.style.transform = `translate(${d.x - size / 2}px, ${d.y - size / 2}px)`;
    d.el.classList.toggle('dark', overFooter);
    px = d.x; py = d.y;
  });
  tickSparks(cursorDots[0].x, cursorDots[0].y, overFooter);
  requestAnimationFrame(tickCursor);
}
requestAnimationFrame(tickCursor);

/* ================================================================
   PRUEBA hover "líquido": distorsión tipo agua/vidrio sobre la card,
   como cappen.com/works — una malla que se ondea según la velocidad
   del cursor. Un solo canvas WebGL compartido (no uno por card, para
   no abrir 15 contextos) que se posiciona exacto sobre la card que
   tiene el cursor encima. Se suma al hover "masa" que ya existe, no
   lo reemplaza.

   Cómo funciona en criollo:
   - Mientras movés el mouse adentro de una card, vamos "pintando" un
     canvas 2D chiquito (el "trail") con manchitas suaves en la
     posición del cursor — más rápido te movés, más grande y más
     brillante la mancha.
     el trail se va borrando solo un poco en cada frame (decae).
   - Ese trail se usa como mapa de altura: el shader mira cuánto
     cambia el brillo del trail de un pixel al de al lado (el
     gradiente) y usa eso para correr la imagen real un poquito para
     cada lado — ahí es donde aparece el efecto de agua/vidrio.
   ================================================================ */
const LiquidDistort = (() => {
  // el canvas vive DENTRO de #center-wrap, como una card más — así hereda
  // el mismo tamaño base (140x140) y, sobre todo, podemos copiarle EXACTO
  // el mismo transform (traslado + tilt 3D + escala) que usa la card real
  // cada frame. La v1 posicionaba el canvas con getBoundingClientRect,
  // que da el rectángulo SIN inclinar de una card inclinada en 3D — por
  // eso se veía "la card deformándose": el canvas plano no coincidía con
  // el dibujo tilteado de abajo. Corregido acá.
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'pointer-events:none; opacity:0; transition:opacity 0.25s ease;';
  centerWrap.appendChild(canvas);
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(140 * DPR);
  canvas.height = Math.round(140 * DPR);

  const gl = canvas.getContext('webgl', { premultipliedAlpha: false, alpha: true });
  if (!gl) return { attach(){}, move(){}, leave(){}, isAttached(){ return false; }, syncTransform(){} };

  const vsSrc = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main(){
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;
  // remolino real centrado en el cursor (como cappen.com): cada fragmento
  // se rota alrededor del punto del mouse, con el ángulo cayendo con la
  // distancia (gaussiana) — un segundo centro, más retrasado y suave,
  // le da sensación de "estela líquida" en vez de un giro seco y único
  const fsSrc = `
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D uImage;
    uniform vec2 uMouse;
    uniform vec2 uMouseTrail;
    uniform float uAngle;

    vec2 swirl(vec2 uv, vec2 center, float angle, float radius){
      vec2 d = uv - center;
      float dist = length(d);
      float falloff = exp(-(dist*dist) / (2.0 * radius * radius));
      float a = angle * falloff;
      float s = sin(a), c = cos(a);
      mat2 rot = mat2(c, -s, s, c);
      return center + rot * d;
    }

    void main(){
      vec2 uv = vUv;
      uv = swirl(uv, uMouse, uAngle, 0.34);
      uv = swirl(uv, uMouseTrail, uAngle * 0.55, 0.42);

      vec2 d = (uv - vUv) * 0.06;
      float r = texture2D(uImage, uv + d).r;
      float g = texture2D(uImage, uv).g;
      float b = texture2D(uImage, uv - d).b;
      gl_FragColor = vec4(r, g, b, 1.0);
    }
  `;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uImage = gl.getUniformLocation(prog, 'uImage');
  const uMouse = gl.getUniformLocation(prog, 'uMouse');
  const uMouseTrail = gl.getUniformLocation(prog, 'uMouseTrail');
  const uAngle = gl.getUniformLocation(prog, 'uAngle');

  const imageTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, imageTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  let attachedCard = null;
  let active = false;
  let mouseU = 0.5, mouseV = 0.5;       // target crudo del cursor (0..1)
  let smU = 0.5, smV = 0.5;             // suavizado, centro principal del remolino
  let trailU = 0.5, trailV = 0.5;       // más retrasado, segundo centro (estela)
  let lastX = 0, lastY = 0, lastT = 0, haveLast = false;
  let smoothVel = 0;

  let rafId = null;
  function frame(){
    rafId = null;
    if (!attachedCard) return;

    smU += (mouseU - smU) * 0.22;
    smV += (mouseV - smV) * 0.22;
    trailU += (smU - trailU) * 0.07;
    trailV += (smV - trailV) * 0.07;
    smoothVel += (0 - smoothVel) * 0.06; // si no hay movimiento nuevo, decae y el remolino se relaja

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, imageTex);
    gl.uniform1i(uImage, 0);
    gl.uniform2f(uMouse, smU, smV);
    gl.uniform2f(uMouseTrail, trailU, trailV);
    gl.uniform1f(uAngle, Math.min(1.15, smoothVel * 1.7)); // más velocidad = más giro

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    const stillMoving = smoothVel > 0.02 || Math.hypot(smU - trailU, smV - trailV) > 0.01;
    if (active || stillMoving){
      rafId = requestAnimationFrame(frame);
    } else {
      canvas.style.opacity = '0';
      attachedCard = null;
    }
  }
  function ensureLoop(){ if (!rafId) rafId = requestAnimationFrame(frame); }

  return {
    attach(card){
      attachedCard = card;
      active = true;
      haveLast = false;
      mouseU = smU = trailU = 0.5;
      mouseV = smV = trailV = 0.5;
      smoothVel = 0;
      gl.bindTexture(gl.TEXTURE_2D, imageTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, card.img); } catch(e){}
      canvas.style.opacity = '1';
      ensureLoop();
    },
    move(clientX, clientY){
      if (!attachedCard || !active) return;
      const r = attachedCard.img.getBoundingClientRect();
      mouseU = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
      mouseV = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
      const now = performance.now();
      if (haveLast){
        const dt = Math.max(1, now - lastT);
        const dist = Math.hypot(clientX - lastX, clientY - lastY);
        smoothVel = Math.max(smoothVel, Math.min(1, (dist / dt) * 0.6));
      }
      lastX = clientX; lastY = clientY; lastT = now; haveLast = true;
      ensureLoop();
    },
    leave(){
      active = false;
      ensureLoop();
    },
    isAttached(card){ return attachedCard === card; },
    syncTransform(transformStr, z){
      canvas.style.transform = transformStr;
      canvas.style.zIndex = z;
    }
  };
})();

function lerp(a, b, t){ return a + (b - a) * t; }
function easeOut(t){ return 1 - Math.pow(1 - t, 4); }
function easeOutBack(t, s = 1.7){
  return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
}

/* celular girado: el nombre no viaja al centro de la pantalla (ahí está el
   carrusel): sube al margen de arriba, centrado (CSS .ls-top), mientras explotan las cards */
function startNameRise(){
  nameText.classList.add('ls-top');
  requestAnimationFrame(centerNameText); // cambia de tamaño: se recentra
  onNameHitsPile();
  // el nombre ya está arriba: el scroll lo deja quieto (como en celular vertical)
  setTimeout(refreshScrollLayoutRefs, 750);
}

function startNameTravel(){
  const rect = nameText.getBoundingClientRect();
  const startLeft = rect.left;
  const nameW = rect.width;
  const targetLeft = (window.innerWidth - nameW) / 2;

  // el borde izquierdo de la pila de fotos (center-wrap) — apenas la
  // "Z" de CRUZ (el borde derecho del nombre) lo toca, dispara la
  // explosión. El nombre sigue viajando igual hasta el centro.
  const pileLeft = centerWrap.getBoundingClientRect().left;
  let exploded = false;

  nameText.style.left = startLeft + 'px';

  const duration = prefersReducedMotion ? 1 : 650;
  const t0 = performance.now();

  function tick(now){
    const t = Math.min((now - t0) / duration, 1);
    const left = lerp(startLeft, targetLeft, easeOut(t));
    nameText.style.left = left + 'px';

    if (!exploded && left + nameW >= pileLeft){
      exploded = true;
      onNameHitsPile();
    }

    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      nameText.style.left = targetLeft + 'px';
      if (!exploded){ exploded = true; onNameHitsPile(); }
    }
  }
  requestAnimationFrame(tick);
}

// el cursor custom (punto + estela) empieza a seguir al mouse/dedo cuando
// arranca el stage del home, o al abrir un proyecto entrando directo por link
let cursorTrackingOn = false;

  document.addEventListener('touchmove', onTouchPoint, { passive:true });

  document.documentElement.classList.add('stage-active');

/* -------- hover en el nombre: efecto "scramble" tipo terminal —
   CAMILA ARRIETA CRUZ ↔ DIRECCIÓN CREATIVA. El cursor es el único
   disparador en los dos sentidos: cada vez que entra al nombre,
   alterna hacia el otro texto (no hay reversión por mouseleave ni por
   tiempo — queda asentado hasta el próximo hover). Mientras el ancho
   del texto cambia letra a letra, se recentra en cada frame para que
   no se desalinee del subtítulo de abajo. -------- */
const NAME_A = 'CAMILA ARRIETA CRUZ'; // el nombre no se traduce nunca
let NAME_B = 'DIRECCIÓN CREATIVA'; // el rol sí — lo pisa applyLang() al iniciar
const SCRAMBLE_CHARS = '!<>-_\\/[]{}—=+*^?#0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZÑÓÁÉÍÚ';

function centerNameText(){
  const w = nameText.getBoundingClientRect().width;
  const centered = (window.innerWidth - w) / 2;
  nameText.style.left = centered + 'px';
}

class TextScramble {
  constructor(el, onUpdate){
    this.el = el;
    this.onUpdate = onUpdate; // callback opcional, corre en cada frame (lo usa el nombre para recentrarse)
    this.queue = [];
    this.frame = 0;
    this.frameRequest = null;
    this.resolve = null;
  }
  setText(newText){
    const oldText = this.el.textContent;
    const length = Math.max(oldText.length, newText.length);
    const promise = new Promise(resolve => { this.resolve = resolve; });
    if (prefersReducedMotion){
      this.el.textContent = newText;
      if (this.onUpdate) this.onUpdate();
      this.resolve();
      return promise;
    }
    this.queue = [];
    for (let i = 0; i < length; i++){
      const from = oldText[i] || '';
      const to = newText[i] || '';
      const start = Math.floor(Math.random() * 8);
      const end = start + Math.floor(Math.random() * 10) + 6;
      this.queue.push({ from, to, start, end, char: '' });
    }
    cancelAnimationFrame(this.frameRequest);
    this.frame = 0;
    this.update();
    return promise;
  }
  update(){
    let output = '';
    let complete = 0;
    for (let i = 0; i < this.queue.length; i++){
      const q = this.queue[i];
      if (this.frame >= q.end){
        complete++;
        output += q.to;
      } else if (this.frame >= q.start){
        if (!q.char || Math.random() < 0.3){
          q.char = SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
        }
        output += q.char;
      } else {
        output += q.from;
      }
    }
    this.el.textContent = output;
    if (this.onUpdate) this.onUpdate();
    if (complete === this.queue.length){
      this.resolve();
    } else {
      this.frameRequest = requestAnimationFrame(() => { this.frame++; this.update(); });
    }
  }
}

// hover de una card del anillo (compu): el centro muestra el proyecto. Lo arma setupNameScramble.
var cardLabel = null;
/* lector de pantalla: cada card del home se anuncia como su proyecto
   ("LACADÉ BODEGÓN, Bodegón de Racing Club · Branding"); se actualiza con el idioma.
   (Recién después de que existe PROJECTS: applyLang corre antes al cargar.) */
var cardAriaReady = false;
function updateCardAria(){
  if (!cardAriaReady) return;
  stackImgs.forEach((img, i) => {
    const l = cardLabelFor(i);
    if (l) img.setAttribute('aria-label', l.name + ', ' + l.sub);
  });
}
// nombre + "qué es · tipo" de la card i (lo usan el hover de compu y el carrusel del celu)
function cardLabelFor(i){
  if (i === ABOUT_CARD) return { name: 'CAMUXI', sub: currentLang === 'es' ? 'Desde 1995' : 'Since 1995' };
  const p = PROJECTS.find(pr => pr.cards && pr.cards.indexOf(i) !== -1);
  if (!p) return null;
  return { name: tr(p.name).toUpperCase(), sub: p.kind ? tr(p.kind) + ' · ' + tr(p.type) : (p.year ? p.year + ' / ' : '') + tr(p.type) };
}

function setupNameScramble(){
  const scrambler = new TextScramble(nameText, centerNameText);
  let showingCreative = false;
  let animating = false;
  nameText.dataset.state = 'name';

  /* hover de una card: el nombre se decodifica al del proyecto y "Buenos Aires —
     Argentina" a año / tipo (mismo scramble que el nombre). Al salir de la card
     vuelve lo que había; entre cards vecinas se espera un poco para no titilar. */
  const subScrambler = subLocationEl ? new TextScramble(subLocationEl) : null;
  let subOriginal = null, labelIndex = null, restoreTimer = null;
  const labelFor = cardLabelFor;
  cardLabel = {
    show(i){
      clearTimeout(restoreTimer);
      if (labelIndex === i) return;
      const l = labelFor(i);
      if (!l) return;
      labelIndex = i;
      if (subOriginal === null && subLocationEl) subOriginal = subLocationEl.textContent;
      nameText.dataset.state = 'project';
      animating = false; // un scramble interrumpido no resuelve su promesa
      scrambler.setText(l.name);
      if (subScrambler) subScrambler.setText(l.sub);
    },
    // sin scramble: el nombre que vuelve volando aterriza en un texto ya escrito
    setNow(i){
      const l = labelFor(i);
      if (!l) return;
      clearTimeout(restoreTimer);
      labelIndex = i;
      if (subOriginal === null && subLocationEl) subOriginal = subLocationEl.textContent;
      nameText.dataset.state = 'project';
      animating = false;
      cancelAnimationFrame(scrambler.frameRequest); scrambler.queue = [];
      nameText.textContent = l.name; centerNameText();
      if (subScrambler){ cancelAnimationFrame(subScrambler.frameRequest); subScrambler.queue = []; subLocationEl.textContent = l.sub; }
    },
    hide(){
      clearTimeout(restoreTimer);
      restoreTimer = setTimeout(() => {
        if (labelIndex === null) return;
        labelIndex = null;
        nameText.dataset.state = showingCreative ? 'role' : 'name';
        scrambler.setText(showingCreative ? NAME_B : NAME_A);
        if (subScrambler && subOriginal !== null) subScrambler.setText(subOriginal).then(() => { subOriginal = null; });
      }, 160);
    }
  };

  function toggleName(){
    if (animating || labelIndex !== null) return;
    animating = true;
    showingCreative = !showingCreative;
    nameText.dataset.state = showingCreative ? 'role' : 'name';
    scrambler.setText(showingCreative ? NAME_B : NAME_A).then(() => {
      animating = false;
    });
  }
  nameText.addEventListener('mouseenter', () => { if (canHover) toggleName(); });
  nameText.addEventListener('click', nameScrollToggle);
  startAutoNameSwap(toggleName);
}

/* -------- touch (sin hover): el nombre alterna solo --------
   mismo scramble que dispara el hover en desktop, pero automático:
   primer cambio a ~3.5s de terminada la explosión, ese rol se queda ~8s,
   vuelve al nombre ~8s, y de ahí en más alterna lento cada ~12s.
   Con "reducir movimiento" no corre: queda fijo en CAMILA ARRIETA CRUZ.
   Si el dispositivo pasa a tener mouse (tablet + mouse), los pasos se
   saltean y manda el hover. -------- */
const AUTO_NAME_STEPS_MS = [650 + 3500, 8000, 8000]; // 650ms ≈ lo que dura la explosión
const AUTO_NAME_LOOP_MS = 12000;
function startAutoNameSwap(toggle){
  if (prefersReducedMotion) return;
  let step = 0;
  function schedule(){
    const delay = step < AUTO_NAME_STEPS_MS.length ? AUTO_NAME_STEPS_MS[step] : AUTO_NAME_LOOP_MS;
    step++;
    setTimeout(() => {
      if (!canHover) toggle();
      schedule();
    }, delay);
  }
  schedule();
}

/* -------- click en el nombre: dispara el mismo scroll que revela el
   footer (scrollY = 1 pantalla = reveal completo), animado con un
   ease-in-out para que se vea la cortina subir. Si el usuario mueve
   la rueda o toca la pantalla en el medio, se le devuelve el control. -------- */
const NAME_SCROLL_MS = 1400;
const SNAP_MS = 1000; // conversión al footer / vuelta disparada por un gesto touch
let nameScrollFrame = null;
let snapping = false;
function scrollToFooter(){ scrollToY(appH, NAME_SCROLL_MS); }
// el nombre: arriba lleva al footer; ya en el footer (pasando la mitad) vuelve arriba
function nameScrollToggle(){ scrollToY(window.scrollY > appH * 0.5 ? 0 : appH, NAME_SCROLL_MS); }
function scrollToY(to, ms){
  if (!document.body.classList.contains('stage-active') && !currentProject) return;
  const from = window.scrollY;
  if (Math.abs(to - from) < 2) return;
  cancelAnimationFrame(nameScrollFrame);
  snapping = true;
  const start = performance.now();
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const cancel = () => {
    cancelAnimationFrame(nameScrollFrame);
    snapping = false;
    window.removeEventListener('wheel', cancel);
    window.removeEventListener('touchstart', cancel);
  };
  window.addEventListener('wheel', cancel, { passive:true });
  window.addEventListener('touchstart', cancel, { passive:true });
  const step = now => {
    const t = Math.min(1, (now - start) / ms);
    window.scrollTo(0, from + (to - from) * ease(t));
    if (t < 1) nameScrollFrame = requestAnimationFrame(step);
    else cancel();
  };
  nameScrollFrame = requestAnimationFrame(step);
}

/* -------- gesto touch ↔ footer (vista de proyecto, celular) --------
   Con un proyecto abierto el footer no sigue al dedo: apenas el gesto se
   decide, se dispara solo la animación completa. Dedo hacia arriba =
   conversión al footer; dedo hacia abajo con el footer (parcial o total)
   visible = vuelta al proyecto. Así nunca queda a medio camino: si se
   suelta (o se interrumpe la animación) en un punto intermedio, se completa
   hacia el extremo más cercano. El bajar desde el final de la última imagen
   lo dispara el feed (ver ProjectView). Con el panel de info abierto el
   gesto lo maneja el panel (cierra). */
(function(){
  let startY = null, decided = false;
  const infoOpen = () => { const i = document.getElementById('pvInfo'); return !!(i && i.classList.contains('is-expanded')); };
  window.addEventListener('touchstart', e => { startY = e.touches[0].clientY; decided = false; }, { passive:true });
  window.addEventListener('touchmove', e => {
    if (canHover || !currentProject || startY === null || infoOpen()) return;
    if (window.scrollY <= 0.5 && !snapping) return; // proyecto en reposo: scrollea el feed normalmente
    if (e.cancelable) e.preventDefault();          // el footer no sigue al dedo
    const dy = e.touches[0].clientY - startY;      // >0: dedo hacia abajo (volver)
    if (!decided && Math.abs(dy) > 8){
      decided = true;
      if (!snapping) scrollToY(dy > 0 ? 0 : appH, SNAP_MS); // si ya corre (lo disparó el feed), no reiniciarla
    }
  }, { passive:false });
  const release = () => {
    startY = null;
    if (canHover || !currentProject || snapping || infoOpen()) return;
    const y = window.scrollY;
    if (y > 0.5 && y < appH - 0.5) scrollToY(y > appH / 2 ? appH : 0, SNAP_MS);
  };
  window.addEventListener('touchend', release, { passive:true });
  window.addEventListener('touchcancel', release, { passive:true });
})();

/* -------- hover en el bloque de contacto del footer: mismo efecto
   "scramble" del nombre, aplicado al label SAY HELLO :) — cambia
   según qué dato se está hovereando, y el otro dato baja su opacidad
   al 20%. A diferencia del nombre (que alterna y queda asentado),
   acá vuelve al estado default en cuanto el mouse sale. Los tres
   textos del label viven en I18N y los actualiza applyLang(). -------- */
let contactHoverState = null; // null | 'email' | 'phone' — para poder refrescar el label visible si cambia el idioma en medio de un hover

function setupContactHover(){
  const emailEl = document.querySelector('.footer-contact-email');
  const phoneEl = document.querySelector('.footer-contact-phone');
  const labelEl = document.querySelector('.footer-contact-label');
  if (!emailEl || !phoneEl || !labelEl) return;

  const labelScrambler = new TextScramble(labelEl);

  // touch: los datos se ven como en desktop por default; al tocar uno se
  // pone bold un instante mientras el link hace lo suyo (mail o WhatsApp).
  // Sin hover no se cambia el label ni se apaga el otro dato: en touch el
  // mouseenter sintético los dejaba así para siempre.

/* -------- explosión: las mismas 15 cards del loader, desde la
   posición en la que quedaron (finalTransform de runLoader), salen
   disparadas con rebote hacia una posición final distribuida en
   anillo (elipse inclinada) -------- */
/* easings para la explosión:
   fase 1 (centro → margen): acelera (arranca lento, termina rápido)
   fase 2 (margen → posición final): va rápido casi todo el tramo y
   recién desacelera cerca del final (no antes) */
function easeInQuad(t){ return t * t; }
function easeArriveLate(t){
  const cut = 0.72;
  if (t < cut) return (t / cut) * 0.82;
  const localT = (t - cut) / (1 - cut);
  return 0.82 + (1 - Math.pow(1 - localT, 3)) * 0.18;
}

/* arma una tabla de longitud de arco real de la elipse (0..2π → 0..perímetro)
   y devuelve helpers para pasar de arco a ángulo y viceversa */
function buildArcTable(rx, ry){
  const steps = 720;
  const cum = [0];
  let prevX = rx, prevY = 0;
  for (let s = 1; s <= steps; s++){
    const th = (s / steps) * Math.PI * 2;
    const x = rx * Math.cos(th), y = ry * Math.sin(th);
    cum.push(cum[s - 1] + Math.hypot(x - prevX, y - prevY));
    prevX = x; prevY = y;
  }
  const total = cum[steps];
  function angleAtArc(target){
    const t = ((target % total) + total) % total;
    let lo = 0, hi = steps;
    while (lo < hi){
      const mid = (lo + hi) >> 1;
      if (cum[mid] < t) lo = mid + 1; else hi = mid;
    }
    const idx = Math.max(1, lo);
    const segT = cum[idx] > cum[idx - 1] ? (t - cum[idx - 1]) / (cum[idx] - cum[idx - 1]) : 0;
    return lerp((idx - 1) / steps * Math.PI * 2, idx / steps * Math.PI * 2, segT);
  }
  return { total, angleAtArc };
}

function explodeCards(){
  const N  = stackImgs.length;
  const cx = window.innerWidth / 2;
  const cy = appH / 2;
  // ring 10% más amplio que antes: da lugar a que las cards "de adelante"
  // puedan crecer sin que el espaciado se rompa — de paso se siente más
  // vasto y profundo, como pidió Cami
  // radios del anillo: dependen del tamaño de pantalla, así que viven
  // en "geom" y se re-arman en cada resize (rebuildRingGeometry), junto
  // con la tabla de arco. Las cards guardan su lugar como FRACCIÓN del
  // perímetro (0..1), no en px, así sobreviven a un cambio de tamaño.
  const geom = {};
  function measureRing(){
    geom.rx = window.innerWidth * 0.33;
    geom.ry = appH * 0.275;
    // pantallas grandes: las cards crecen con la pantalla (en una laptop de
    // 1440×900 o menos quedan igual; tope 1.6× en monitores muy grandes)
    geom.k = Math.min(1.6, Math.max(1, Math.min(window.innerWidth / 1440, appH / 900)));
    const table = buildArcTable(geom.rx, geom.ry);
    geom.total = table.total;
    geom.angleAtArc = table.angleAtArc;
  }
  measureRing();
  rebuildRingGeometry = measureRing;
  const tilt = -0.5;
  // rango de escala por profundidad: las de atrás quedan igual que antes
  // (0.75), las de adelante ahora un 10% más grandes (0.97 → 1.067) para
  // acentuar la diferencia cerca/lejos — el ring se agrandó (arriba) para
  // que ese crecimiento no genere solapamiento entre cards vecinas
  const minScale = 0.75, maxScale = 1.067;
  const CARD_SIZE = 140; // px, mismo tamaño que #center-wrap

  // fase de la profundidad alineada a donde la elipse tiene MÁS espacio
  // natural entre puntos (eje corto), así las cards más grandes caen
  // justo donde más lugar hay para ellas
  function depthAt(angle){ return (1 + Math.sin(angle)) / 2; } // 0 lejos, 1 cerca
  function scaleAt(angle){ return minScale + depthAt(angle) * (maxScale - minScale); }

  function ringPoint(angle){
    const ux = Math.cos(angle) * geom.rx;
    const uy = Math.sin(angle) * geom.ry;
    const dx = ux * Math.cos(tilt) - uy * Math.sin(tilt);
    const dy = ux * Math.sin(tilt) + uy * Math.cos(tilt);
    const scale = scaleAt(angle) * geom.k;
    return { dx, dy, scale, z: Math.round(depthAt(angle) * 500) };
  }

  // posiciones EQUIDISTANTES en arco real de la elipse (no en ángulo, que
  // quedaría más junto de un lado que del otro) — el anillo orbita
  // avanzando también en arco (ver startOrbit), así el espaciado entre
  // cards se mantiene constante todo el tiempo, no solo al asentarse
  const arcPositions = [];
  for (let i = 0; i < N; i++) arcPositions.push(i / N); // fracción del perímetro
  const ringAngles = arcPositions.map(f => geom.angleAtArc(f * geom.total));

  // punto del margen contra el que rebota cada card: sale disparada en
  // una dirección PROPIA y random (no la de su posición final — eso es
  // lo que hacía que se viera como espiral prolija) hasta pegar contra
  // el borde de pantalla, con un margen también random por card para
  // que no lleguen todas sincronizadas.
  function marginPoint(angle, margin){
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let t = Infinity;
    if (dx >  0.0001) t = Math.min(t, (window.innerWidth  - margin - cx) / dx);
    else if (dx < -0.0001) t = Math.min(t, (margin - cx) / dx);
    if (dy >  0.0001) t = Math.min(t, (appH - margin - cy) / dy);
    else if (dy < -0.0001) t = Math.min(t, (margin - cy) / dy);
    return { x: dx * t, y: dy * t };
  }

  const duration = prefersReducedMotion ? 1 : 560; // con "reducir movimiento" las cards van directo a su lugar
  const bounceT  = 0.22; // % del recorrido hasta pegar en el margen — bien cortito, tipo BUM
  const t0 = performance.now();

  const cards = stackImgs.map((img, i) => {
    // dispara SIEMPRE hacia el mismo lado en el que va a quedar —
    // así no cruzan la pantalla de punta a punta — pero con algo de
    // margen random para que no lleguen todas sincronizadas
    const angle  = ringAngles[i];
    const margin = 15 + Math.random() * 50;
    return {
      img,
      angle,
      arcPos: arcPositions[i],
      delay:  Math.random() * 90, // sale cada una en un instante propio, no en barrido
      start:  finalTransformValues(i),
      bounce: marginPoint(angle, margin),
      target: ringPoint(angle),
      tiltX: 0, tiltY: 0, tiltTX: 0, tiltTY: 0,
      hoverScale: 1, hovering: false
    };
  });

  // celular (touch + angosto): las cards no arman el anillo disperso de
  // desktop sino el cover-flow de frente (ver Coverflow). La explosión
  // dispara cada una hacia su lado (la del centro arriba) y aterriza en su
  // pose. Tablet (touch + ancha) se ve igual que desktop: mismo anillo, que
  // ahí se gira arrastrando (ver startOrbit).
  const useCoverflow = !canHover && (isNarrow || landscapePhone);
  if (useCoverflow){
    cards.forEach((c, i) => {
      const d = Coverflow.wrap(i);
      c.cf = true;
      c.target = Coverflow.pose(d);
      const side = d === 0 ? -Math.PI / 2 : (d > 0 ? 0 : Math.PI);
      c.bounce = marginPoint(side + (Math.random() - 0.5) * 1.2, 15 + Math.random() * 50);
    });
  }

  /* VARIANTE A — sin tilt: solo el efecto líquido + escala/sombra.
     No hay inclinación 3D en absoluto, ni fija ni dinámica. */
  cards.forEach((c) => {
    // cualquier card abre su proyecto, en todos los dispositivos (en touch
    // el navegador no dispara click si el dedo arrastró el carrusel/anillo)
    c.img.addEventListener('click', () => openProjectForCard(stackImgs.indexOf(c.img)));
    // teclado: cada card se elige con Tab y se abre con Enter (o espacio). Al
    // enfocarla pasa lo mismo que con el hover: el centro muestra el proyecto y
    // el anillo desacelera. El lector de pantalla anuncia el proyecto (updateCardAria).
    const cardIdx = stackImgs.indexOf(c.img);
    c.img.tabIndex = 0;
    c.img.setAttribute('role', 'link');
    c.img.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openProjectForCard(cardIdx); }
    });
    c.img.addEventListener('focus', () => {
      c.hovering = true;
      if (cardLabel && !currentProject && scrollP < 0.05) cardLabel.show(cardIdx);
    });
    c.img.addEventListener('blur', () => { c.hovering = false; if (cardLabel) cardLabel.hide(); });
    c.img.addEventListener('mousemove', (e) => {
      if (!canHover) return;
      LiquidDistort.move(e.clientX, e.clientY);
    });
    c.img.addEventListener('mouseenter', () => {
      // en touch un toque dispara mouseenter pero nunca mouseleave: la
      // card quedaba "levantada" para siempre
      if (!canHover) return;
      c.hovering = true;
      c.img.classList.add('hover-mass');
      LiquidDistort.attach(c);
      if (cardLabel && !currentProject && scrollP < 0.05) cardLabel.show(stackImgs.indexOf(c.img));
    });
    c.img.addEventListener('mouseleave', () => {
      c.hovering = false;
      c.img.classList.remove('hover-mass');
      LiquidDistort.leave();
      if (cardLabel) cardLabel.hide();
    });
  });

  function tick(now){
    let allDone = true;
    cards.forEach((c) => {
      const localT = Math.min(1, Math.max(0, (now - t0 - c.delay) / duration));
      if (localT < 1) allDone = false;

      let tx, ty;
      if (localT < bounceT){
        const e = easeInQuad(localT / bounceT);
        tx = lerp(c.start.tx, c.bounce.x, e);
        ty = lerp(c.start.ty, c.bounce.y, e);
      } else {
        const e = easeArriveLate((localT - bounceT) / (1 - bounceT));
        tx = lerp(c.bounce.x, c.target.dx, e);
        ty = lerp(c.bounce.y, c.target.dy, e);
      }

      const eFull = easeArriveLate(localT);
      const rot   = lerp(c.start.rot, 0, eFull);
      const scale = lerp(1, c.target.scale, eFull);

      if (c.cf){
        const rotY = lerp(0, c.target.rotY, eFull);
        c.img.style.transform = `${cfPersp()}translate(${tx}px, ${ty}px) translateZ(${lerp(0, c.target.tz || 0, eFull)}px) rotate(${rot}deg) rotateY(${rotY}deg) scale(${scale})`;
        c.img.style.opacity = lerp(1, c.target.op, eFull);
        c.img.style.filter = 'brightness(' + lerp(1, c.target.bright, eFull) + ')';
      } else {
        c.img.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
      }
      c.img.style.zIndex = c.target.z;
    });
    if (!allDone) requestAnimationFrame(tick);
    else if (useCoverflow) Coverflow.start(cards);
    else startOrbit(cards, ringPoint, geom);
  }
  requestAnimationFrame(tick);
}

/* -------- una vez asentadas, el anillo entero orbita despacio sobre
   su eje para siempre, dando una mejor vista de todos los proyectos --------
   avanza en ARCO real (no en ángulo): así la distancia geométrica entre
   cada card y la siguiente queda exactamente igual todo el tiempo, en
   vez de apretarse o abrirse a medida que gira.
   Suma el hover "masa" (aprobado): tilt 3D + escala + z-index elevado
   sobre la card bajo el cursor. */
const CARD_MAGNET_RADIUS = 280; // px alrededor del cursor donde las cards sienten la atracción
const CARD_MAGNET_PX = 12;      // corrimiento máximo hacia el cursor

const ORBIT_LAP_MS = 60000; // una vuelta completa (todo el perímetro) cada 60s

function startOrbit(cards, ringPoint, geom){
  let arcRotation = 0; // en fracción del perímetro (0..1 = una vuelta)
  let last = performance.now();
  // touch (tablet): el dedo puede girar el anillo — ver más abajo
  let autoK = 1;  // 0..1: cuánto pesa el giro automático (vuelve suave después de soltar)
  let vel = 0;    // inercia después de soltar, en fracción de vuelta por ms
  let drag = null;
  // con el mouse sobre una card el anillo desacelera hasta el 25% (y vuelve
  // igual de suave al salir): da tiempo a leer el nombre y hacer click
  let hoverK = 1;

  function frame(now){
    const dt = Math.min(50, now - last);
    last = now;
    const hoverTarget = cards.some(c => c.hovering) ? 0.25 : 1;
    hoverK += (hoverTarget - hoverK) * (1 - Math.exp(-dt / 220));
    if (!(drag && drag.active)){
      if (Math.abs(vel) > 0.0000005){ arcRotation += vel * dt; vel *= Math.pow(0.994, dt); }
      else vel = 0;
      autoK = Math.min(1, autoK + dt / 1500);
      if (!prefersReducedMotion) arcRotation += autoK * hoverK * dt / ORBIT_LAP_MS;
    }

    // implosión: 0 = anillo normal (scroll arriba del todo), 1 = todas
    // apiladas en el centro exacto (misma pose que al terminar el
    // loader) — atado 1 a 1 al scroll, reversible en cualquier punto
    const ip = 1 - Math.pow(1 - scrollP, 2);

    // "gravedad": centro de #center-wrap en pantalla, para saber dónde
    // está cada card respecto del cursor (se mueve con el scroll)
    const wrapRect = centerWrap.getBoundingClientRect();
    const wrapCX = wrapRect.left + wrapRect.width / 2;
    const wrapCY = wrapRect.top + wrapRect.height / 2;

    cards.forEach((c, i) => {
      const angle = geom.angleAtArc((c.arcPos + arcRotation) * geom.total);
      const p = ringPoint(angle);
      c.hoverScale += ((c.hovering ? 1.12 : 1) - c.hoverScale) * 0.2;
      const ringScale = p.scale * c.hoverScale;

      // magnetismo sutil: las cards cerca del cursor se corren unos px
      // hacia él. La fuerza es 0 pegado al cursor y en el borde del
      // radio, y máxima a mitad de camino: así la card que está justo
      // debajo no tiembla, y las de alrededor se inclinan hacia ella.
      // Se apaga con la implosión del scroll. Solo transform, no layout.
      let magTX = 0, magTY = 0;
      if (mouseSeen && canHover && ip < 1){
        const cx = wrapCX + p.dx, cy = wrapCY + p.dy;
        const mdx = mouseX - cx, mdy = mouseY - cy;
        const d = Math.hypot(mdx, mdy);
        if (d > 0 && d < CARD_MAGNET_RADIUS){
          const u = d / CARD_MAGNET_RADIUS;
          const pull = CARD_MAGNET_PX * 4 * u * (1 - u) * (1 - ip);
          magTX = (mdx / d) * pull;
          magTY = (mdy / d) * pull;
        }
      }
      c.magX = (c.magX || 0) + (magTX - (c.magX || 0)) * 0.08;
      c.magY = (c.magY || 0) + (magTY - (c.magY || 0)) * 0.08;

      const tx    = lerp(p.dx, 0, ip) + c.magX;
      const ty    = lerp(p.dy, 0, ip) + c.magY;
      const scale = lerp(ringScale, 1, ip);
      const z     = lerp(p.z, (i + 1) * 40, ip);

      const transformStr = `translate(${tx}px, ${ty}px) rotate(0deg) scale(${scale})`;
      c.img.style.transform = transformStr;
      // en vez de opacity (que hace que se transparenten entre sí y se
      // vea el solape), las oscurecemos hasta volverse del mismo negro
      // que el fondo del loader (#111) — desaparecen "fundiéndose" con
      // el fondo, no viéndose unas a través de otras
      c.img.style.filter = 'brightness(' + (1 - ip) + ')';
      c.img.style.zIndex = c.hovering ? 9998 : z;
      // el canvas del efecto líquido copia EXACTO el mismo transform de
      // la card que tiene encima, así queda pegado pixel a pixel
      if (LiquidDistort.isAttached(c)) LiquidDistort.syncTransform(transformStr, 9999);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* touch (tablet): mismo anillo que desktop, pero sin mouse el
     comportamiento cambia — arrastrar el dedo hacia un lado u otro gira
     el anillo (las cards de adelante acompañan al dedo); al soltar sigue
     con inercia y el giro automático vuelve de a poco. La card que se
     toca se levanta y muestra el efecto líquido, el equivalente táctil
     del hover. El arrastre vertical sigue siendo el scroll de la página. */
  function cardAt(target){
    const img = target && target.closest ? target.closest('.stack-img') : null;
    return img ? cards.find(c => c.img === img) : null;
  }
  function release(){
    if (drag && drag.card){
      drag.card.hovering = false;
      LiquidDistort.leave();
    }
  }
  loader.addEventListener('touchstart', (e) => {
    if (canHover || e.touches.length !== 1 || scrollP > 0.02){ drag = null; return; }
    const t = e.touches[0];
    const now = performance.now();
    drag = { x0: t.clientX, y0: t.clientY, rot0: arcRotation, lastX: t.clientX, lastT: now,
             v: 0, active: false, decided: false, card: cardAt(e.target) };
    if (drag.card){
      drag.card.hovering = true;
      LiquidDistort.attach(drag.card);
      LiquidDistort.move(t.clientX, t.clientY);
    }
  }, { passive:true });
  loader.addEventListener('touchmove', (e) => {
    if (!drag) return;
    const t = e.touches[0];
    if (!t) return;
    if (drag.card) LiquidDistort.move(t.clientX, t.clientY);
    if (!drag.decided){
      const dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
        drag.decided = true; drag.active = true;
        vel = 0; autoK = 0;
        drag.rot0 = arcRotation; drag.x0 = t.clientX;
      } else if (Math.abs(dy) > 8){
        drag.decided = true; // vertical: es el scroll de la página
        return;
      } else {
        return;
      }
    }
    if (!drag.active) return;
    const now = performance.now();
    // px de dedo → fracción de vuelta (arco real del anillo); con signo
    // negativo las cards de adelante (abajo) se mueven hacia donde va el dedo
    arcRotation = drag.rot0 - (t.clientX - drag.x0) / geom.total;
    const ddt = Math.max(1, now - drag.lastT);
    drag.v = 0.8 * (-(t.clientX - drag.lastX) / geom.total / ddt) + 0.2 * drag.v;
    drag.lastX = t.clientX; drag.lastT = now;
  }, { passive:true });
  const onEnd = () => {
    if (!drag) return;
    if (drag.active) vel = Math.max(-0.0004, Math.min(0.0004, drag.v));
    release();
    drag = null;
  };
  loader.addEventListener('touchend', onEnd, { passive:true });
  loader.addEventListener('touchcancel', onEnd, { passive:true });
}

/* -------- touch (mobile y tablet): el anillo visto de frente --------
   estilo cover-flow: la card del centro grande y nítida, las de los
   costados más chicas, más oscuras y giradas en perspectiva (rotateY),
   las de atrás se desvanecen. Todo se calcula desde "pos" (qué card está
   en el centro, en unidades de card y fraccional), así que:
   - gira solo, lento y continuo: misma velocidad que la órbita de
     desktop (una vuelta completa cada ORBIT_LAP_MS)
   - arrastre horizontal: el dedo toma el control de pos; al soltar sigue
     con inercia y el giro automático vuelve de a poco (autoK 0 → 1)
   - arrastre vertical: no se toca, es el scroll de la página
   - tap en cualquier card: abre su proyecto (click en explodeCards)
   - mientras se arrastra, la card del centro muestra el efecto líquido
     (LiquidDistort, el mismo del hover de desktop) siguiendo al dedo
   - scroll hacia el footer: implosionan desde su pose hacia el centro,
     igual que en desktop
   La geometría se lee en cada frame, así que rotar el teléfono o
   cambiar el tamaño la recalcula sola. -------- */
const CF_PERSPECTIVE = 800;
/* celular girado: una sola perspectiva para todo el carrusel (en #center-wrap,
   por CSS) en vez de una por card, así se lee como un anillo visto de frente */
function cfPersp(){ return landscapePhone ? '' : `perspective(${CF_PERSPECTIVE}px) `; }
const Coverflow = (() => {
  const N = stackImgs.length;
  const CARD_MS = ORBIT_LAP_MS / N; // tiempo que tarda en pasar de una card a la siguiente
  let cards = [];
  let pos = 0;
  let autoK = 1;   // 0..1: cuánto pesa el giro automático
  let vel = 0;     // inercia después de soltar, en cards por ms
  let drag = null;
  let last = 0;
  // al soltar el dedo: el carrusel se acomoda en la card elegida y se queda
  // quieto un rato (con su texto abajo) antes de retomar el giro automático
  const HOLD_MS = 6000;
  let snap = null, holdUntil = 0;

  // distancia con signo al centro, en cards, dentro de [-N/2, N/2)
  function wrap(d){ return ((d % N) + N * 1.5) % N - N / 2; }

  function geometry(){
    const vw = window.innerWidth;
    // card del centro: grande pero con tope, porque las fotos son de 480px.
    // +20px sobre el tamaño anterior: la del centro crece 20px, las vecinas (escala ~0.7) unos 14px
    // y las de atrás (escala ~0.5) ≥ 10px
    let size = Math.min(vw * 0.56 + 20, appH * 0.4 + 20, 320);
    // celular girado: cards más grandes, sin tocar los textos de arriba
    // (nombre + ciudad, ~60px) ni los de abajo (proyecto, ~68px)
    if (landscapePhone) size = Math.min((appH * 0.4 + 20) * 1.21, appH - 123);
    const step = Math.min(vw * 0.34, size * 0.95) * (landscapePhone ? 0.935 : 1);
    return { center: size / 140, step };
  }

  function pose(d){
    const g = geometry();
    const a = Math.abs(d), sg = Math.sign(d);
    const near = Math.min(a, 1);                       // 0 → 1 de la central a la primera del costado
    const far = Math.max(0, Math.min(a, 3.5) - 1);     // las siguientes se apilan más juntas
    if (landscapePhone) return {
      // anillo: las de los costados giran hacia adentro (28° la vecina, 35° las de atrás)
      // y se alejan en profundidad; la del centro queda de frente. Al alejarse la
      // perspectiva las acerca al centro: se separan un poco más para compensar
      dx: sg * (g.step * 1.2 * near + g.step * 0.55 * far),
      dy: 0,
      tz: -(140 * near + 70 * far),
      scale: g.center * (1 - 0.08 * near - 0.04 * far),
      rotY: sg * (28 * near + 7 * Math.min(far, 1)),
      op: a < 2.4 ? 1 : Math.max(0, 1 - (a - 2.4) / 0.9),
      bright: 1 - 0.38 * near - 0.12 * far,
      z: Math.round(1000 - a * 100)
    };
    return {
      dx: sg * (g.step * near + g.step * 0.42 * far),
      dy: 0,
      tz: 0,
      scale: g.center * (1 - 0.3 * near - 0.1 * far),
      rotY: sg * 48 * near,
      op: a < 2.4 ? 1 : Math.max(0, 1 - (a - 2.4) / 0.9),
      bright: 1 - 0.38 * near - 0.12 * far,
      z: Math.round(1000 - a * 100)
    };
  }

  /* celular: debajo de la card del frente, su proyecto (nombre + qué es).
     Se ve mientras la card está cerca del centro y se apaga en el cambio
     (también mientras se arrastra con el dedo, y queda fijo al soltar);
     el texto nuevo entra decodificándose (como el hover de compu). */
  let label = null, labelPill = null, labelName = null, labelSub = null, nameScr = null, subScr = null, labelKey = '', labelTimer = null;
  function makeLabel(){
    // sello CX-XX: justo debajo de la card del frente, y es lo primero que aparece
    labelPill = document.createElement('div');
    labelPill.className = 'cf-label-pill';
    labelPill.setAttribute('aria-hidden', 'true');
    // nombre y qué es · tipo: abajo de todo, entran un instante después del sello
    label = document.createElement('div');
    label.className = 'cf-label';
    label.setAttribute('aria-hidden', 'true'); // el alt de cada card ya lo dice
    labelName = document.createElement('div'); labelName.className = 'cf-label-name';
    labelSub = document.createElement('div'); labelSub.className = 'cf-label-sub';
    label.append(labelName, labelSub);
    loader.append(labelPill, label);
    nameScr = new TextScramble(labelName);
    subScr = new TextScramble(labelSub);
  }
  function cardPx(){ return geometry().center * 140; }
  function updateLabel(){
    let bi = 0, bd = Infinity;
    cards.forEach((c, i) => { const a = Math.abs(wrap(i - pos)); if (a < bd){ bd = a; bi = i; } });
    const idx = stackImgs.indexOf(cards[bi].img);
    const key = idx + ':' + currentLang;
    if (key !== labelKey){
      labelKey = key;
      const l = cardLabelFor(idx);
      const p = PROJECTS.find(pr => pr.cards && pr.cards.indexOf(idx) !== -1);
      labelPill.textContent = p ? 'CX-' + String(PROJECTS.indexOf(p) + 1).padStart(2, '0') : '';
      labelPill.hidden = !p;
      clearTimeout(labelTimer);
      nameScr.setText(''); subScr.setText('');
      labelTimer = setTimeout(() => {
        nameScr.setText(l ? l.name : '');
        subScr.setText(l ? l.sub : '');
      }, 350);
    }
    // visible del todo a menos de 0.25 card del centro, apagado en el cambio (0.45+)
    const vis = 1 - Math.min(1, Math.max(0, (bd - 0.25) / 0.2));
    const scrollFade = 1 - Math.min(1, scrollP * 6);
    label.style.opacity = labelPill.style.opacity = String(vis * scrollFade);
    const r = centerWrap.getBoundingClientRect();
    const cardTop = r.top + r.height / 2 - cardPx() / 2;
    if (landscapePhone && subLocationEl){
      // celular girado: arriba de la card, centrado en el aire entre "Buenos Aires — Argentina" y la card
      const subBottom = subLocationEl.getBoundingClientRect().bottom;
      labelPill.style.top = ((subBottom + cardTop) / 2 - labelPill.offsetHeight / 2) + 'px';
    } else {
      // el sello, 16px debajo de la card del frente
      labelPill.style.top = (cardTop + cardPx() + 16) + 'px';
    }
  }

  function centerCard(){
    let best = null, bd = Infinity;
    cards.forEach((c, i) => {
      const a = Math.abs(wrap(i - pos));
      if (a < bd){ bd = a; best = c; }
    });
    return best;
  }


  function frame(now){
    const dt = Math.min(50, now - last);
    last = now;

    if (drag && drag.active){
      // pos lo maneja el dedo (onMove)
    } else if (snap){
      const t = Math.min(1, (now - snap.t0) / snap.dur);
      pos = snap.from + (snap.to - snap.from) * (1 - Math.pow(1 - t, 3));
      if (t >= 1) snap = null;
    } else {
      if (Math.abs(vel) > 0.00002){ pos += vel * dt; vel *= Math.pow(0.994, dt); }
      else vel = 0;
      if (now > holdUntil) autoK = Math.min(1, autoK + dt / 1500);
      if (!prefersReducedMotion) pos += autoK * dt / CARD_MS;
    }

    const ip = 1 - Math.pow(1 - scrollP, 2); // implosión, igual que en desktop
    cards.forEach((c, i) => {
      const p = pose(wrap(i - pos));
      const tx = lerp(p.dx, 0, ip);
      const ty = lerp(p.dy, 0, ip);
      const scale = lerp(p.scale, 1, ip);
      const rotY = lerp(p.rotY, 0, ip);
      const transformStr = `${cfPersp()}translate(${tx}px, ${ty}px) translateZ(${lerp(p.tz, 0, ip)}px) rotateY(${rotY}deg) scale(${scale})`;
      c.img.style.transform = transformStr;
      c.img.style.opacity = lerp(p.op, 1, ip);
      c.img.style.filter = 'brightness(' + (p.bright * (1 - ip)) + ')';
      c.img.style.zIndex = Math.round(lerp(p.z, (i + 1) * 40, ip));
      if (LiquidDistort.isAttached(c)) LiquidDistort.syncTransform(transformStr, 9999);
    });
    if (label) updateLabel();

    // el efecto líquido acompaña a la card que esté en el centro mientras se arrastra
    if (drag && drag.active){
      const cc = centerCard();
      if (cc && cc !== drag.liquidCard){ drag.liquidCard = cc; LiquidDistort.attach(cc); }
    }
    requestAnimationFrame(frame);
  }

  function onStart(e){
    if (e.touches.length !== 1 || scrollP > 0.02){ drag = null; return; }
    const t = e.touches[0];
    const now = performance.now();
    drag = { x0: t.clientX, y0: t.clientY, pos0: pos, t0: now, lastX: t.clientX, lastT: now,
             v: 0, active: false, decided: false, liquidCard: null, target: e.target };
  }
  function onMove(e){
    if (!drag) return;
    const t = e.touches[0];
    if (!t) return;
    if (!drag.decided){
      const dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){
        drag.decided = true; drag.active = true;
        vel = 0; autoK = 0; snap = null;
        drag.pos0 = pos; drag.x0 = t.clientX;
      } else if (Math.abs(dy) > 8){
        drag.decided = true; // vertical: es el scroll de la página
        return;
      } else {
        return;
      }
    }
    if (!drag.active) return;
    const now = performance.now();
    const unit = geometry().step;
    pos = drag.pos0 - (t.clientX - drag.x0) / unit;
    const ddt = Math.max(1, now - drag.lastT);
    drag.v = 0.8 * (-(t.clientX - drag.lastX) / unit / ddt) + 0.2 * drag.v;
    drag.lastX = t.clientX; drag.lastT = now;
    LiquidDistort.move(t.clientX, t.clientY);
  }
  function onEnd(){
    if (!drag) return;
    if (drag.active){
      // se acomoda en la card más cercana a donde la llevaba el envión
      const now = performance.now();
      const target = Math.round(pos + Math.max(-0.006, Math.min(0.006, drag.v)) * 220);
      snap = { from: pos, to: target, t0: now, dur: 450 };
      vel = 0; autoK = 0;
      holdUntil = now + HOLD_MS;
      LiquidDistort.leave();
    }
    drag = null;
  }

  return {
    wrap, pose,
    start(cs){
      cards = cs;
      // las transforms se escriben en cada frame: sin la transición de
      // la caída del loader, que haría que las cards "persigan" al dedo
      cards.forEach(c => { c.img.style.transition = 'none'; });
      makeLabel();
      loader.addEventListener('touchstart', onStart, { passive:true });
      loader.addEventListener('touchmove', onMove, { passive:true });
      loader.addEventListener('touchend', onEnd, { passive:true });
      loader.addEventListener('touchcancel', onEnd, { passive:true });
      last = performance.now();
      requestAnimationFrame(frame);
    }
  };
})();

/* textos todavía no escritos: lo que está entre [corchetes] y las
   descripciones "(placeholder)" no se muestran nunca en el sitio */
function publicText(t){
  t = (t || '').replace(/\s*\[[^\]]*\]/g, '').trim();
  return /\(placeholder\)/i.test(t) ? '' : t;
}
function tr(v){ return (v && typeof v === 'object' && !Array.isArray(v)) ? (v[currentLang] || v.es || v.en || '') : (v || ''); }
// coords { lat, lng, label } → "34.6179° S · 58.4404° O — BUENOS AIRES"
// (sin signos: N/S y E/O; en inglés el oeste es W). Sin coords → ''.
function formatCoords(c){
  if (!c || !isFinite(c.lat) || !isFinite(c.lng)) return '';
  const ns = c.lat < 0 ? 'S' : 'N';
  const ew = c.lng < 0 ? (currentLang === 'es' ? 'O' : 'W') : 'E';
  const label = tr(c.label);
  // espacios duros dentro de cada parte: si la línea no entra, corta
  // limpio entre las coordenadas y el lugar (nunca deja el "—" suelto)
  const nb = t => t.replace(/ /g, '\u00a0');
  const pos = nb(Math.abs(c.lat).toFixed(4) + '° ' + ns + ' · ' + Math.abs(c.lng).toFixed(4) + '° ' + ew);
  return pos + (label ? ' ' + nb('— ' + label) : '');
}
function projectBySlug(slug){ return PROJECTS.find(p => p.slug === slug) || null; }
function projectMedia(p){
  if (p.media && p.media.length) return p.media;
  // sin fotos cargadas: las de sus propias cards del home (no las de otros proyectos)
  return (p.cards && p.cards.length ? p.cards : [0]).map(i => {
    const img = stackImgs[i];
    return { type:'image', src: img.src, w: img.naturalWidth || 480, h: img.naturalHeight || 480, alt: img.alt };
  });
}

/* -------- SEO por proyecto: título, description, canonical, OG y Twitter.
   (Google lo lee porque ejecuta JS; WhatsApp/LinkedIn/IG leen el HTML
   crudo y siguen mostrando el del home — pendiente para más adelante.) -------- */
const SEO_SELECTORS = {
  description: 'meta[name="description"]',
  canonical: 'link[rel="canonical"]',
  ogTitle: 'meta[property="og:title"]',
  ogDescription: 'meta[property="og:description"]',
  ogUrl: 'meta[property="og:url"]',
  ogImage: 'meta[property="og:image"]',
  twTitle: 'meta[name="twitter:title"]',
  twDescription: 'meta[name="twitter:description"]',
  twImage: 'meta[name="twitter:image"]'
};
const SEO_DEFAULTS = {};
Object.entries(SEO_SELECTORS).forEach(([k, sel]) => {
  const el = document.querySelector(sel);
  if (el) SEO_DEFAULTS[k] = el.getAttribute(k === 'canonical' ? 'href' : 'content');
});
function setSeo(values){
  Object.entries(SEO_SELECTORS).forEach(([k, sel]) => {
    const el = document.querySelector(sel);
    if (el && values[k] != null) el.setAttribute(k === 'canonical' ? 'href' : 'content', values[k]);
  });
}
function applyProjectSeo(p){
  const title = tr(p.seoTitle) || (p.name + ' — Camila Arrieta Cruz');
  const desc = tr(p.seoDescription);
  const url = SITE_URL + '/' + p.slug;
  document.title = title;
  setSeo({ description:desc, canonical:url, ogTitle:title, ogDescription:desc, ogUrl:url,
           ogImage:p.ogImage, twTitle:title, twDescription:desc, twImage:p.ogImage });
}
function restoreHomeSeo(){
  document.title = I18N[currentLang].title;
  setSeo(SEO_DEFAULTS);
}

/* -------- vista de proyecto: render de textos, feed infinito y contador -------- */
const ProjectView = (() => {

  const counterNum = $('pvCounterNum'), counterTotal = $('pvCounterTotal'), counterBar = $('pvCounterBar');

  let items = [], offsets = [], copyH = 0, total = 0, rafPending = false;

  function renderText(p){

    $('pvCoordsBody').textContent = coordsText; // (en la barra de compu las coordenadas van en la info)
    $('pvCoordsBody').hidden = !coordsText;
    // (en la píldora: rubro y año / tipo van en la info, en una línea)
